<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D10">
<title>Shorts Deck</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0B0D10; --ink3:#1E252D;
    --paper:#EFF2F6; --body-text:#C9D1DC; --muted:#8B95A3; --faint:#5A6472;
    --know:#3DD68C; --fuzzy:#F0B342; --dunno:#FF6B5B; --gold:#E4C271; --coral:#FF8F6B;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
    max-width:520px;margin:0 auto;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .rail{display:flex;align-items:center;gap:8px;padding:12px 20px 8px}
  .iconbtn{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px;cursor:pointer}
  .iconbtn:disabled{opacity:.28;pointer-events:none}
  .gauge{flex:1;height:3px;border-radius:2px;background:var(--ink3);overflow:hidden;min-width:14px}
  .gaugebar{height:100%;width:0;background:var(--gold);transition:width .3s ease}
  .counter{font-family:var(--mono);font-size:11.5px;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
  .counter .dim{color:var(--faint)}
  .counter b{font-weight:500}
  .counter .g-know{color:var(--know)}
  .counter .g-fuzzy{color:var(--fuzzy)}
  .counter .g-dunno{color:var(--dunno)}
  .counter .g-none{color:var(--faint)}
  .counter a{color:var(--muted);text-decoration:none}

  .titlebar{padding:2px 22px 2px}
  .titlebar .en{font-family:var(--serif);font-weight:300;line-height:1.14;letter-spacing:-.015em;font-size:clamp(26px,6.6vw,40px);text-wrap:balance;margin:0}

  .stage{position:relative;overflow:hidden}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;gap:16px;padding:10px 22px 0;touch-action:none;will-change:transform;-webkit-touch-callout:none}
  .card.bonus::before{content:"";position:absolute;inset:10px 4px;border:1px solid var(--gold);border-radius:20px;opacity:.45;pointer-events:none}
  .chip{
    align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);padding:3px 8px;border-radius:99px;
  }
  .tapcue{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px;animation:breathe 3.4s ease-in-out infinite}
  .tapcue i{display:block;width:5px;height:5px;border-radius:50%;background:var(--faint)}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  .reader{position:absolute;inset:0;display:none;flex-direction:column;padding:0 22px 16px;touch-action:pan-y}
  .stage.reading .card{opacity:0;pointer-events:none}
  .stage.reading .reader{display:flex}
  #app.reading .legend{visibility:hidden}
  .readerhead{display:flex;justify-content:flex-end;gap:6px;padding-top:8px}
  .fontbtn{background:var(--ink3);border:0;color:var(--paper);font-family:var(--sans);font-size:11px;width:26px;height:24px;border-radius:6px;cursor:pointer}
  .fontbtn:active{background:color-mix(in srgb,var(--ink3) 60%,var(--paper) 10%)}
  .readerbody{
    overflow-y:auto;touch-action:pan-y;padding-top:8px;border-top:1px solid var(--ink3);
    -webkit-user-select:text;user-select:text;display:flex;flex-direction:column;gap:9px;
    font-size:calc(14.5px * var(--rfs,1));line-height:1.62;color:var(--body-text);
  }
  .readerbody .lhint,.readerbody p.lhint{font-size:1.1em;font-weight:600;color:var(--paper);margin:0 0 2px}
  .readerbody p{margin:0}
  .readerbody h3{font-family:var(--serif);font-weight:400;font-size:1.38em;margin:14px 0 4px;color:var(--paper)}
  .readerbody h4{font-family:var(--serif);font-weight:400;font-size:1.17em;margin:12px 0 4px;color:var(--paper)}
  .readerbody h5{font-size:.97em;margin:10px 0 3px;color:var(--paper);font-weight:600}
  .readerbody ul,.readerbody ol{margin:2px 0;padding-left:20px}
  .readerbody li{margin:3px 0}
  .readerbody blockquote{border-left:2px solid var(--gold);padding-left:12px;margin:6px 0;color:var(--faint);font-style:italic}
  .readerbody .callout{background:var(--ink3);border-radius:10px;padding:10px 12px;margin:4px 0}
  .readerbody hr{border:0;border-top:1px solid var(--ink3);margin:10px 0}
  .readerbody pre{background:var(--ink3);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:4px 0}
  .readerbody pre code{background:none;color:var(--paper);padding:0}
  .readerbody code{background:color-mix(in srgb,var(--coral) 22%,transparent);color:var(--coral);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.9em}
  .readerbody table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.9em}
  .readerbody th,.readerbody td{border:1px solid var(--ink3);padding:6px 8px;text-align:left;vertical-align:top}
  .readerbody th{color:var(--gold);font-weight:500;background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .src{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none;border-bottom:1px solid var(--ink3);padding-bottom:2px;margin-top:4px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--know);outline-offset:3px}

  .wash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .1s;z-index:1}
  .verdict{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
    font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;
    padding:10px 20px;border:1.5px solid currentColor;border-radius:6px;
    opacity:0;pointer-events:none;transition:opacity .1s,transform .1s;white-space:nowrap;z-index:2;
  }

  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ink3);border-top:1px solid var(--ink3);font-family:var(--mono)}
  .legend button{background:var(--ink);border:0;padding:12px 6px;text-align:center;color:var(--paper);font-size:13px;font-family:var(--mono);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .legend button:active{background:var(--ink3)}
  .legend .k{color:var(--know)}
  .legend .f{color:var(--fuzzy)}
  .legend .d{color:var(--dunno)}

  .sheet{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:26px;padding:0 26px;background:var(--ink);z-index:3}
  .sheet.on{display:flex}
  .sheet h2{font-family:var(--serif);font-weight:300;font-size:32px;margin:0;line-height:1.1}
  .sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

  /* ── 모아보기 ── */
  .listview{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--ink);display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .listview.on{display:flex}
  .listhead{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
  .listhead button{background:none;border:0;color:var(--paper);font-size:14px;font-family:var(--sans);cursor:pointer;padding:4px 2px}
  .listhead input{flex:1;background:var(--ink3);border:0;border-radius:8px;color:var(--paper);font-family:var(--sans);font-size:14px;padding:9px 12px}
  .listhead input::placeholder{color:var(--faint)}
  .tabs{display:flex;gap:6px;padding:6px 18px 10px;overflow-x:auto}
  .tab{flex:none;background:var(--ink3);border:0;border-radius:99px;color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--gold);color:var(--ink)}
  .recent{padding:0 18px}
  .rechead{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:6px 0 8px}
  .recrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
  .recchip{flex:none;background:var(--ink3);border:0;border-radius:99px;color:var(--paper);font-size:12.5px;padding:8px 13px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .listbody{flex:1;overflow-y:auto;padding:4px 18px 24px;-webkit-user-select:text;user-select:text}
  .lrow{border-bottom:1px solid var(--ink3);padding:12px 0;cursor:pointer}
  .lhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lfront{font-family:var(--serif);font-size:16px;color:var(--paper)}
  .lstep{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:99px;background:var(--ink3);color:var(--muted)}
  .lstep.s1{background:color-mix(in srgb,var(--fuzzy) 30%,transparent);color:var(--fuzzy)}
  .lstep.s2,.lstep.s3{background:color-mix(in srgb,var(--know) 30%,transparent);color:var(--know)}
  .lbody{margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--body-text)}
  .lbody code{background:color-mix(in srgb,var(--coral) 22%,transparent);color:var(--coral);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.9em}
  .lbody table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12.5px}
  .lbody th,.lbody td{border:1px solid var(--ink3);padding:5px 7px;text-align:left}
  .lempty{color:var(--faint);font-size:13px;padding:30px 0;text-align:center}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="rail">
    <button class="iconbtn" id="listBtn" aria-label="모아보기">&#9776;</button>
    <button class="iconbtn" id="undoBtn" aria-label="되돌리기" disabled>&#8634;</button>
    <div class="gauge"><div class="gaugebar" id="gaugebar"></div></div>
    <div class="counter" id="counter">&middot;</div>
  </div>

  <div class="titlebar"><p class="en" id="cardTitle"></p></div>

  <div class="stage" id="stage">
    <div class="wash" id="wash"></div>
    <div class="card" id="card">
      <div class="front" id="front"></div>
    </div>
    <div class="reader" id="reader">
      <div class="readerhead"><button class="fontbtn" id="fontDown">가-</button><button class="fontbtn" id="fontUp">가+</button></div>
      <div class="readerbody" id="readerBody"></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="sheet on" id="loading"><h2>불러오는 중</h2><p id="loadmsg">Notion에서 카드를 가져옴</p></div>
  </div>

  <div class="legend">
    <button class="d" id="btnDunno">모름</button>
    <button class="f" id="btnFuzzy">애매</button>
    <button class="k" id="btnKnow">이해</button>
  </div>
</div>

<div class="listview" id="listview">
  <div class="listhead">
    <button id="closeListBtn">&larr; 닫기</button>
    <input id="searchBox" placeholder="검색">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="recent" id="recentSec"></div>
  <div class="listbody" id="listBody"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const local = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
const escBr = (s) => String(s == null ? '' : s).split(/<br\s*\/?>/i).map(esc).join('<br>');

const cardKeyOf = (front) => String(front || '').toLowerCase().replace(/[^a-z0-9가-힣]+/g, ' ').trim();

/* ── 원본 블록 렌더링 ────────────────────────────────────────
   서버는 Notion 원본 블록을 그대로 보내고, 렌더는 여기(표시 시점)에서 한다.
   그래야 렌더 로직을 바꿔도 재동기화가 필요 없다. 옛 캐시/씨앗(cards.seed.json)의
   평문 문자열 형식도 함께 지원한다(둘 다 typeof로 구분). */

function richHtml(rich){
  return (rich || []).map((t) => {
    let s = esc(t.t);
    if (t.code) s = '<code>' + s + '</code>';
    if (t.bold) s = '<b>' + s + '</b>';
    if (t.italic) s = '<i>' + s + '</i>';
    if (t.strike) s = '<s>' + s + '</s>';
    if (t.underline) s = '<u>' + s + '</u>';
    if (t.href) s = '<a href="' + esc(t.href) + '" target="_blank" rel="noopener">' + s + '</a>';
    return s;
  }).join('');
}
function tableHtml(b){
  const rows = b.rows || [];
  return '<table>' + rows.map((row, ri) => {
    const tag = b.headerRow && ri === 0 ? 'th' : 'td';
    return '<tr>' + row.map((cell) => '<' + tag + '>' + richHtml(cell) + '</' + tag + '>').join('') + '</tr>';
  }).join('') + '</table>';
}
function blockHtml(b){
  if (!b) return '';
  switch (b.type){
    case 'heading_1': return '<h3>' + richHtml(b.rich) + '</h3>';
    case 'heading_2': return '<h4>' + richHtml(b.rich) + '</h4>';
    case 'heading_3': return '<h5>' + richHtml(b.rich) + '</h5>';
    case 'bulleted_list_item': return '<li>' + richHtml(b.rich) + '</li>';
    case 'numbered_list_item': return '<li>' + richHtml(b.rich) + '</li>';
    case 'quote': return '<blockquote>' + richHtml(b.rich) + '</blockquote>';
    case 'callout': return '<div class="callout">' + richHtml(b.rich) + '</div>';
    case 'to_do': return '<div>' + (b.checked ? '&#9745; ' : '&#9744; ') + richHtml(b.rich) + '</div>';
    case 'code': return '<pre><code>' + richHtml(b.rich) + '</code></pre>';
    case 'divider': return '<hr>';
    case 'table': return tableHtml(b);
    default: return b.rich ? '<p>' + richHtml(b.rich) + '</p>' : '';
  }
}
function blocksHtml(blocks){
  let html = '', open = null;
  for (const b of blocks || []){
    const isLi = b.type === 'bulleted_list_item' || b.type === 'numbered_list_item';
    const tag = b.type === 'numbered_list_item' ? 'ol' : 'ul';
    if (isLi){
      if (open !== tag){ if (open) html += '</' + open + '>'; html += '<' + tag + '>'; open = tag; }
    } else if (open){ html += '</' + open + '>'; open = null; }
    html += blockHtml(b);
  }
  if (open) html += '</' + open + '>';
  return html;
}

// hint/context/detail은 새 형식(블록 객체)과 옛 형식(문자열/문자열 배열) 둘 다 온다.
function hintHtml(c){
  if (c.hint == null) return null;
  if (typeof c.hint === 'string') return escBr(c.hint);
  return richHtml(c.hint.rich || []);
}
function detailHtml(c){
  if (!c.detail || !c.detail.length) return '';
  if (typeof c.detail[0] === 'string') return c.detail.map((t) => '<p>' + escBr(t) + '</p>').join('');
  return blocksHtml(c.detail);
}

/* ── 상태 ───────────────────────────────────────────────── */
let deck = [], idx = 0, remaining = 0, total = 0, reading = false;

/* ── 카드 공급 ──────────────────────────────────────────── */
async function fetchBatch(n){
  const res = await fetch('/api/cards?n=' + n);
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  if (typeof d.total === 'number') total = d.total;
  if (typeof d.remaining === 'number') remaining = d.remaining;
  updateGauge();
  if (d.cards?.length){ local.set('sd_last', { cards: d.cards, at: Date.now() }); return d.cards; }
  throw new Error(d.syncing ? '동기화 중' : '카드 없음'); // 빈 결과는 폴백(캐시→씨앗)으로 넘겨야 한다
}

async function fetchWithFallback(n){
  try { return await fetchBatch(n); }
  catch (e) {
    const c = local.get('sd_last', null);
    if (c?.cards?.length) return c.cards;
    const res = await fetch('/cards.seed.json').catch(() => null);
    if (res?.ok){
      const all = await res.json();
      const g = local.get('sd_grades', {});
      total = all.length; remaining = all.length;
      updateGauge();
      return all.map((x) => ({ ...x, prevGrade: g[cardKeyOf(x.front)]?.grade || null, step: 0 }))
        .sort(() => Math.random() - 0.5);
    }
    throw e;
  }
}

let fetching = false;
async function ensureQueue(){
  if (fetching || deck.length - idx > 3) return;
  fetching = true;
  try {
    const more = await fetchWithFallback(8);
    const have = new Set(deck.map((c) => c.id));
    const fresh = more.filter((c) => !have.has(c.id));
    if (fresh.length) deck.push(...fresh);
  } catch (e) { /* 네트워크 실패 — 남은 큐로 계속 스와이프 가능하게 조용히 무시 */ }
  fetching = false;
  if (idx < deck.length && $('loading').classList.contains('on')) showCurrent();
}

function pushRecent(c){
  const rs = local.get('sd_recent', []).filter((r) => r.id !== c.id);
  rs.unshift({ id: c.id, front: c.front });
  local.set('sd_recent', rs.slice(0, 30));
}

/* ── 렌더 ───────────────────────────────────────────────── */
function updateGauge(){
  $('gaugebar').style.width = total ? (100 * (1 - remaining / Math.max(total, 1))) + '%' : '0%';
}

function isWeak(c){ return c.prevGrade === 'dunno'; }

// 카드 한 장에 딸린 Notion 속성 요약 — 세션 진행률보다 "지금 이 카드"에 집중하기 위해
// 상단 rail의 숫자 카운터 자리를 이걸로 대체한다(전체 진행률은 모아보기에서 확인).
const GRADE_LABEL = { know: ['이해', 'g-know'], fuzzy: ['애매', 'g-fuzzy'], dunno: ['모름', 'g-dunno'] };
const STEP_LABEL = ['0', '1차', '2차', '3차'];
function fmtDate(iso){
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}
function renderCardInfo(c){
  const g = GRADE_LABEL[c.prevGrade] || ['—', 'g-none'];
  const parts = [
    '<b class="' + g[1] + '">' + g[0] + '</b>',
    (c.n || 0) + '회',
    STEP_LABEL[Math.min(c.step || 0, 3)],
  ];
  const date = fmtDate(c.created);
  if (date) parts.push(date);
  let html = parts.join(' <span class="dim">&middot;</span> ');
  if (c.url) html += ' <span class="dim">&middot;</span> <a href="' + esc(c.url) + '" target="_blank" rel="noopener">&#8599;</a>';
  $('counter').innerHTML = html;
}

function showCurrent(){
  const c = deck[idx];
  if (!c){ $('loadmsg').textContent = '더 가져오는 중…'; $('loading').classList.add('on'); return; }
  $('loading').classList.remove('on');
  $('cardTitle').textContent = c.front;
  const weak = isWeak(c);
  $('card').classList.toggle('bonus', weak);
  $('front').innerHTML =
    (weak ? '<div class="chip">다시 만남</div>' : '') +
    '<div class="tapcue"><i></i>탭하면 전문</div>';
  renderCardInfo(c);
  updateGauge();
  pushRecent(c);
  ensureQueue();
}

function renderReader(){
  const c = deck[idx];
  const h = hintHtml(c);
  $('readerBody').innerHTML =
    (h ? '<p class="lhint">' + h + '</p>' : '') +
    detailHtml(c) +
    (c.url ? '<a class="src" href="' + esc(c.url) + '" target="_blank" rel="noopener">원본 쇼츠 &#8599;</a>' : '');
  $('readerBody').scrollTop = 0;
}

/* ── 채점 ───────────────────────────────────────────────── */
// 되돌리기(직전 1건만) — Slidebox 참고. "잘못 매긴 채점 복구"가 목적이라 복습횟수(n)까지
// 되돌린다(2026-09-03 사용자 결정, 서버 writeGrade의 "횟수 단조증가" 원칙의 유일한 예외).
let lastAction = null;
function updateUndoBtn(){ $('undoBtn').disabled = !lastAction; }

function doGrade(g){
  const c = deck[idx];
  const key = c.key || cardKeyOf(c.front);
  const prevStep = c.step || 0;
  const prevGrade = c.prevGrade || null;
  const lg = local.get('sd_grades', {});
  const prevN = lg[key]?.n || 0;
  let step = prevStep;
  if (g === 'know') step = Math.min(prevStep + 1, 3);
  else if (g === 'dunno') step = Math.max(prevStep - 1, 0);

  lastAction = { cardIdx: idx, key, pageId: c.id, prevStep, prevGrade, prevN, prevRemaining: remaining };
  updateUndoBtn();

  if (prevStep === 0 && step > 0) remaining = Math.max(0, remaining - 1);
  else if (prevStep > 0 && step === 0) remaining = Math.min(total, remaining + 1);
  c.prevGrade = g; c.step = step; c.n = prevN + 1;

  lg[key] = { grade: g, n: prevN + 1, step, at: Date.now() };
  local.set('sd_grades', lg);

  fetch('/api/grade', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pageId: c.id, key, grade: g }),
  }).then((r) => r.json()).then((d) => { if (typeof d.step === 'number') c.step = d.step; }).catch(() => {});

  updateGauge();
  idx++;
  showCurrent();
}

function undo(){
  if (!lastAction) return;
  const a = lastAction;
  lastAction = null; updateUndoBtn();

  idx = a.cardIdx;
  const c = deck[idx];
  c.prevGrade = a.prevGrade; c.step = a.prevStep; c.n = a.prevN;
  remaining = a.prevRemaining;

  const lg = local.get('sd_grades', {});
  if (a.prevGrade == null && a.prevN === 0) delete lg[a.key];
  else lg[a.key] = { grade: a.prevGrade, n: a.prevN, step: a.prevStep, at: Date.now() };
  local.set('sd_grades', lg);

  const prev = (a.prevGrade == null && a.prevN === 0) ? null : { grade: a.prevGrade, n: a.prevN, step: a.prevStep };
  fetch('/api/grade', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pageId: a.pageId, key: a.key, undo: true, prev }),
  }).catch(() => {});

  updateGauge();
  showCurrent();
}
$('undoBtn').addEventListener('click', undo);

function step(dir){
  if (dir > 0){ idx++; }
  else if (dir < 0 && idx > 0){ idx--; }
  showCurrent();
}

/* ── 1단(카드) 제스처: 좌/우=이전·다음 이동(채점 없음), 아래→위=전문 열기, 위→아래=무동작.
   채점(모름/애매/이해)은 아래 버튼으로만 한다(2026-09-03 결정 — 스와이프·롱프레스 채점 폐기). ── */
const card = $('card'), wash = $('wash'), verdict = $('verdict'), stage = $('stage'), app = $('app');
const TH = 90;
let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false;

function show(color, label, t){
  wash.style.background = 'radial-gradient(120% 80% at 50% 50%, color-mix(in srgb, ' + color + ' 26%, transparent), transparent 72%)';
  wash.style.opacity = t;
  verdict.textContent = label; verdict.style.color = color;
  verdict.style.opacity = t;
  verdict.style.transform = 'translate(-50%,-50%) scale(' + (0.85 + t * 0.15) + ')';
}
const hide = () => { wash.style.opacity = 0; verdict.style.opacity = 0; };

function exitAndGrade(g){
  const dir = g === 'know' ? 1 : -1;
  card.style.transition = 'transform .2s cubic-bezier(.2,.7,.3,1)';
  card.style.transform = 'translateX(' + (dir * 120) + '%) rotate(' + (dir * 8) + 'deg)';
  setTimeout(() => { card.style.transition = 'none'; card.style.transform = ''; doGrade(g); }, 190);
}
function exitAndFuzzy(){
  card.style.transition = 'transform .16s ease, opacity .16s ease';
  card.style.transform = 'scale(.95)'; card.style.opacity = '0.35';
  setTimeout(() => {
    card.style.transition = 'none'; card.style.transform = ''; card.style.opacity = '';
    doGrade('fuzzy');
  }, 170);
}
function exitAndStepH(dir){ // dir: 1=다음(왼쪽으로 밀기), -1=이전(오른쪽으로 밀기)
  card.style.transition = 'transform .2s cubic-bezier(.2,.7,.3,1)';
  card.style.transform = 'translateX(' + (dir * -120) + '%) rotate(' + (dir * -6) + 'deg)';
  setTimeout(() => { card.style.transition = 'none'; card.style.transform = ''; step(dir); }, 190);
}
function exitToReader(){
  card.style.transition = 'transform .16s ease, opacity .16s ease';
  card.style.transform = 'translateY(-18px) scale(.97)'; card.style.opacity = '0.4';
  setTimeout(() => {
    card.style.transition = 'none'; card.style.transform = ''; card.style.opacity = '';
    hide(); openReader();
  }, 150);
}

$('btnDunno').addEventListener('click', () => { if (!reading) exitAndGrade('dunno'); });
$('btnFuzzy').addEventListener('click', () => { if (!reading) exitAndFuzzy(); });
$('btnKnow').addEventListener('click', () => { if (!reading) exitAndGrade('know'); });

card.addEventListener('pointerdown', (e) => {
  if (reading || $('loading').classList.contains('on')) return;
  dragging = true; moved = false;
  sx = e.clientX; sy = e.clientY; dx = 0; dy = 0;
  card.setPointerCapture(e.pointerId);
  card.style.transition = 'none';
});
card.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dx = e.clientX - sx; dy = e.clientY - sy;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
  const vert = Math.abs(dy) > Math.abs(dx);
  if (vert && dy < 0){ // 아래→위만 반응(전문 열기 예고). 위→아래는 무동작이라 되돌린다.
    card.style.transform = 'translateY(' + dy + 'px)';
    show('#8B95A3', '펼치기', Math.min(Math.abs(dy) / TH, 1));
  } else if (!vert){
    card.style.transform = 'translate(' + dx + 'px,0) rotate(' + (dx * 0.02) + 'deg)';
    const t = Math.min(Math.abs(dx) / TH, 1);
    if (dx < -24) show('#8B95A3', '다음', t);
    else if (dx > 24) show('#8B95A3', '이전', t);
    else hide();
  } else {
    card.style.transform = ''; hide();
  }
});
card.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  hide();
  card.style.transition = 'transform .2s cubic-bezier(.2,.7,.3,1)';
  if (!moved){ card.style.transform = ''; openReader(); return; }
  const vert = Math.abs(dy) > Math.abs(dx);
  if (vert){
    if (dy < -TH) exitToReader(); else card.style.transform = '';
    return;
  }
  if (dx < -TH) exitAndStepH(1);
  else if (dx > TH) exitAndStepH(-1);
  else card.style.transform = '';
});
card.addEventListener('pointercancel', () => { dragging = false; hide(); card.style.transform = ''; });

/* ── 2단(읽기) 열기/닫기 ─────────────────────────────────── */
function openReader(){ reading = true; app.classList.add('reading'); stage.classList.add('reading'); renderReader(); }
function closeReader(){ reading = false; app.classList.remove('reading'); stage.classList.remove('reading'); }

// 2단 글자크기 — 0.85~1.5배, localStorage에 기억
let readerScale = local.get('sd_fontscale', 1);
function applyReaderScale(){ document.documentElement.style.setProperty('--rfs', readerScale); }
applyReaderScale();
$('fontDown').addEventListener('click', () => {
  readerScale = Math.max(0.85, +(readerScale - 0.1).toFixed(2));
  local.set('sd_fontscale', readerScale); applyReaderScale();
});
$('fontUp').addEventListener('click', () => {
  readerScale = Math.min(1.5, +(readerScale + 0.1).toFixed(2));
  local.set('sd_fontscale', readerScale); applyReaderScale();
});

const readerBody = $('readerBody'), reader = $('reader');
let rsx = 0, rsy = 0, rdx = 0, rdy = 0, rDragging = false, rAtTop = false, rAtBottom = false, rMode = null;

readerBody.addEventListener('pointerdown', (e) => {
  rDragging = true; rsx = e.clientX; rsy = e.clientY; rdx = 0; rdy = 0; rMode = null;
  rAtTop = readerBody.scrollTop <= 0;
  rAtBottom = readerBody.scrollTop + readerBody.clientHeight >= readerBody.scrollHeight - 1;
  try { readerBody.setPointerCapture(e.pointerId); } catch (err) {} // 드래그 중 포인터가 요소 밖으로 나가도 이벤트를 계속 받는다
});
readerBody.addEventListener('pointermove', (e) => {
  if (!rDragging) return;
  rdx = e.clientX - rsx; rdy = e.clientY - rsy;
  if (rMode === null && (Math.abs(rdx) > 10 || Math.abs(rdy) > 10)){
    rMode = Math.abs(rdx) > Math.abs(rdy) ? 'h' : 'v';
  }
  if (rMode === 'h') reader.style.transform = 'translateX(' + rdx + 'px)';
  else if (rMode === 'v'){
    // 가장자리 오버스크롤 — 손을 떼기 전까지 2단↔1단이 디졸브(크로스페이드)로 이어진다.
    // 임계값을 못 넘기고 떼면 이 상태 그대로 2단으로 되돌아간다(rMode==='v'의 else 분기 없음 = 라이브 되돌림).
    let d = 0;
    if (rdy > 0 && rAtTop) d = Math.min(rdy, 140);
    else if (rdy < 0 && rAtBottom) d = Math.max(rdy, -140);
    if (d !== 0){
      reader.style.transform = 'translateY(' + d * 0.5 + 'px)';
      const p = Math.min(Math.abs(d) / TH, 1);
      reader.style.opacity = 1 - p * 0.9;
      card.style.opacity = p;
    } else {
      reader.style.transform = ''; reader.style.opacity = ''; card.style.opacity = '';
    }
  }
});
readerBody.addEventListener('pointerup', () => {
  if (!rDragging) return; rDragging = false;
  reader.style.transition = 'transform .18s ease, opacity .18s ease';
  card.style.transition = 'opacity .18s ease';
  const closeH = rMode === 'h' && Math.abs(rdx) > TH;
  const closeV = rMode === 'v' && Math.abs(rdy) > TH && ((rdy > 0 && rAtTop) || (rdy < 0 && rAtBottom));
  reader.style.transform = '';
  if (closeH || closeV){
    reader.style.opacity = ''; card.style.opacity = '';
    closeReader();
  } else if (rMode === 'v'){
    reader.style.opacity = ''; card.style.opacity = ''; // 임계값 못 넘김 — 2단으로 복귀
  }
  setTimeout(() => { reader.style.transition = ''; card.style.transition = ''; }, 200);
  rMode = null;
});
readerBody.addEventListener('pointercancel', () => {
  rDragging = false; reader.style.transform = ''; reader.style.opacity = ''; card.style.opacity = ''; rMode = null;
});

/* ── 모아보기 ───────────────────────────────────────────── */
let indexItems = null, listFilter = 'all', listQuery = '', expandedId = null, expandedCache = {};
const listview = $('listview'), tabs = $('tabs'), recentSec = $('recentSec'), listBody = $('listBody');

async function openList(){
  listview.classList.add('on');
  if (!indexItems){
    try {
      const res = await fetch('/api/index');
      const d = await res.json();
      indexItems = d.items || [];
    } catch (e) { indexItems = []; }
  }
  renderTabs(); renderRecent(); renderList();
}
function closeList(){ listview.classList.remove('on'); }

function renderTabs(){
  const counts = [0, 0, 0, 0];
  indexItems.forEach((it) => counts[Math.min(it.step, 3)]++);
  const labels = ['0', '1차', '2차', '3차'];
  tabs.innerHTML = ['<button class="tab' + (listFilter === 'all' ? ' on' : '') + '" data-f="all">전체 ' + indexItems.length + '</button>']
    .concat(labels.map((l, i) => '<button class="tab' + (listFilter === String(i) ? ' on' : '') + '" data-f="' + i + '">' + l + ' ' + counts[i] + '</button>'))
    .join('');
}
tabs.addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  listFilter = b.dataset.f; renderTabs(); renderList();
});
$('searchBox').addEventListener('input', (e) => { listQuery = e.target.value.trim().toLowerCase(); renderList(); });

function renderRecent(){
  const rs = local.get('sd_recent', []);
  recentSec.innerHTML = rs.length
    ? '<div class="rechead">최근 본 것</div><div class="recrow">' +
      rs.slice(0, 15).map((r) => '<button class="recchip" data-id="' + esc(r.id) + '">' + esc(r.front) + '</button>').join('') + '</div>'
    : '';
}
recentSec.addEventListener('click', (e) => {
  const b = e.target.closest('.recchip'); if (!b) return;
  listFilter = 'all'; listQuery = ''; $('searchBox').value = ''; renderTabs();
  toggleExpand(b.dataset.id);
});

function rowHtml(it){
  const badge = ['0', '1차', '2차', '3차'][Math.min(it.step, 3)];
  const open = expandedId === it.id;
  return '<div class="lrow' + (open ? ' open' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="lhead"><span class="lfront">' + esc(it.front) + '</span><span class="lstep s' + Math.min(it.step, 3) + '">' + badge + '</span></div>' +
    (open ? '<div class="lbody">' + (expandedCache[it.id] ? expandDetail(expandedCache[it.id]) : '불러오는 중…') + '</div>' : '') +
    '</div>';
}
function expandDetail(c){
  const h = hintHtml(c);
  return (h ? '<p style="color:var(--paper);font-weight:600;margin:0 0 6px">' + h + '</p>' : '') + detailHtml(c) +
    (c.url ? '<a class="src" href="' + esc(c.url) + '" target="_blank" rel="noopener">원본 쇼츠 &#8599;</a>' : '');
}
function renderList(){
  let items = indexItems || [];
  if (listFilter !== 'all') items = items.filter((it) => Math.min(it.step, 3) === Number(listFilter));
  if (listQuery) items = items.filter((it) => it.front.toLowerCase().includes(listQuery));
  listBody.innerHTML = items.length
    ? items.slice(0, 300).map(rowHtml).join('')
    : '<div class="lempty">해당하는 카드 없음</div>';
}
listBody.addEventListener('click', (e) => {
  const row = e.target.closest('.lrow'); if (!row) return;
  toggleExpand(row.dataset.id);
});
async function toggleExpand(id){
  expandedId = expandedId === id ? null : id;
  renderList();
  if (!expandedId) return;
  const it = (indexItems || []).find((x) => x.id === expandedId);
  if (it) pushRecent(it);
  if (!expandedCache[expandedId]){
    try {
      const res = await fetch('/api/card?id=' + encodeURIComponent(expandedId));
      const d = await res.json();
      expandedCache[expandedId] = d.error ? { hint: null, detail: [] } : d;
    } catch (e) { expandedCache[expandedId] = { hint: null, detail: [] }; }
    renderList();
  }
}

$('listBtn').addEventListener('click', openList);
$('closeListBtn').addEventListener('click', closeList);

/* ── 시작 ───────────────────────────────────────────────── */
(async () => {
  try {
    const cards = await fetchWithFallback(8);
    if (!cards.length){
      $('loadmsg').textContent = '카드가 없음 — Notion DB를 확인';
      return;
    }
    deck = cards; idx = 0;
    showCurrent();
  } catch (e) {
    $('loadmsg').textContent = '불러오기 실패 — ' + e.message;
  }
})();
</script>
</body>
</html>
