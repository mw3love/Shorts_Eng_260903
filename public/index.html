<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D10">
<title>Shorts Deck</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0B0D10; --ink3:#1E252D;
    --paper:#EFF2F6; --muted:#8B95A3; --faint:#5A6472;
    --know:#3DD68C; --fuzzy:#F0B342; --dunno:#FF6B5B; --gold:#E4C271;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    max-width:520px;margin:0 auto;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .rail{display:flex;align-items:center;gap:12px;padding:14px 20px 10px}
  .dots{display:flex;gap:5px;flex:1}
  .dot{height:3px;flex:1;border-radius:2px;background:var(--ink3);transition:background .25s}
  .dot.know{background:var(--know)}
  .dot.fuzzy{background:var(--fuzzy)}
  .dot.dunno{background:var(--dunno)}
  .streak{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .streak b{color:var(--know);font-weight:500}

  .stage{position:relative;overflow:hidden;display:flex}
  .card{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;padding:8px 22px 0;touch-action:none;will-change:transform}
  .card.bonus::before{content:"";position:absolute;inset:10px 14px;border:1px solid var(--gold);border-radius:20px;opacity:.45;pointer-events:none}
  .front{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
  .chip{
    align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);padding:3px 8px;border-radius:99px;
  }
  .en{font-family:var(--serif);font-weight:300;line-height:1.16;letter-spacing:-.015em;font-size:clamp(30px,7.4vw,46px);text-wrap:balance;margin:0}
  .ctx{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.5;color:var(--faint);border-left:2px solid var(--ink3);padding-left:12px;margin:0}
  .tapcue{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px;animation:breathe 3.4s ease-in-out infinite}
  .tapcue i{display:block;width:5px;height:5px;border-radius:50%;background:var(--faint)}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  .back{display:none;flex-direction:column;gap:14px;min-height:0;padding-bottom:14px}
  .back.on{display:flex}
  .hint{font-size:19px;line-height:1.45;font-weight:500;margin:0;border-top:1px solid var(--ink3);padding-top:16px;-webkit-user-select:text;user-select:text}
  .detail{
    overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:9px;
    font-size:14px;line-height:1.62;color:var(--muted);-webkit-user-select:text;user-select:text;
    -webkit-mask-image:linear-gradient(180deg,#000 88%,transparent);mask-image:linear-gradient(180deg,#000 88%,transparent);
  }
  .detail p{margin:0}
  .more{align-self:flex-start;background:none;border:1px solid var(--ink3);color:var(--muted);font-family:var(--sans);font-size:12.5px;padding:7px 13px;border-radius:99px;cursor:pointer}
  .src{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none;border-bottom:1px solid var(--ink3);padding-bottom:2px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--know);outline-offset:3px}

  .wash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .1s}
  .verdict{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
    font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;
    padding:10px 20px;border:1.5px solid currentColor;border-radius:6px;
    opacity:0;pointer-events:none;transition:opacity .1s,transform .1s;white-space:nowrap;
  }

  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ink3);border-top:1px solid var(--ink3);font-family:var(--mono)}
  .legend div{background:var(--ink);padding:9px 6px 10px;text-align:center;color:var(--paper);font-size:12px}
  .legend b{display:block;font-size:13px;margin-bottom:2px;font-weight:400}
  .legend em{display:block;font-style:normal;font-size:9.5px;color:var(--faint);margin-top:2px}
  .legend .k b{color:var(--know)}
  .legend .f b{color:var(--fuzzy)}
  .legend .d b{color:var(--dunno)}

  .sheet{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:26px;padding:0 26px;background:var(--ink)}
  .sheet.on{display:flex}
  .sheet h2{font-family:var(--serif);font-weight:300;font-size:38px;margin:0;line-height:1.1}
  .sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
  .tally{display:flex;gap:26px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tally div{display:flex;flex-direction:column;gap:5px}
  .tally span{font-size:34px;line-height:1}
  .tally em{font-size:11px;letter-spacing:.12em;color:var(--faint);font-style:normal}
  .again{align-self:flex-start;background:var(--paper);color:var(--ink);border:0;border-radius:99px;font-family:var(--sans);font-size:15px;font-weight:600;padding:14px 30px;cursor:pointer}
  .sync{position:absolute;top:14px;right:20px;font-family:var(--mono);font-size:10px;color:var(--faint)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="rail">
    <div class="dots" id="dots"></div>
    <div class="streak">연속 <b id="streak">0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="wash" id="wash"></div>
    <div class="card" id="card">
      <div class="front" id="front"></div>
      <div class="back" id="back"></div>
    </div>
    <div class="verdict" id="verdict"></div>

    <div class="sheet on" id="loading"><h2>불러오는 중</h2><p id="loadmsg">Notion에서 카드를 가져옴</p></div>
    <div class="sheet" id="done">
      <h2>한 판 끝.</h2>
      <div class="tally" id="tally"></div>
      <button class="again" id="again">한 판 더</button>
      <div class="sync" id="sync"></div>
    </div>
  </div>

  <div class="legend">
    <div class="k"><b>&uarr;</b>이해<em>안 보고 넘김</em></div>
    <div class="f"><b>&rarr;</b>애매<em>헷갈림</em></div>
    <div class="d"><b>탭 &rarr; &uarr;</b>모름<em>뜻 보고 넘김</em></div>
  </div>
</div>

<script>
const SESSION = 10;
const $ = (id) => document.getElementById(id);

let CARDS = [], grades = {}, deck = [], idx = 0, reveal = 0, streak = 0, results = [], pending = 0;

const local = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ── 데이터 로드 ─────────────────────────────────────────
   Worker가 진실의 원본. 실패하면 마지막으로 성공한 캐시 → 씨앗 데이터 순으로 퇴화한다.
   폰에서 오프라인이거나 Notion이 느릴 때도 앱이 빈 화면이 되지 않게. */
async function load(){
  try {
    const res = await fetch('/api/cards');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    CARDS = d.cards || [];
    grades = d.grades || {};
    local.set('sd_cache', { cards: CARDS, grades, at: Date.now() });
    return 'notion';
  } catch (e) {
    const c = local.get('sd_cache', null);
    if (c?.cards?.length){ CARDS = c.cards; grades = c.grades || {}; return 'cache'; }
    const res = await fetch('/cards.seed.json').catch(() => null);
    if (res?.ok){ CARDS = await res.json(); grades = local.get('sd_grades', {}); return 'seed'; }
    throw e;
  }
}

const keyOf = (c) => c.key || String(c.front || '').toLowerCase().replace(/[^a-z0-9가-힣]+/g, ' ').trim();
const gradeOf = (c) => grades[keyOf(c)]?.grade;

function buildDeck(){
  const weak = CARDS.filter((c) => gradeOf(c) === 'dunno');
  const rest = CARDS.filter((c) => gradeOf(c) !== 'dunno');
  return [...weak.slice(0, 4), ...rest].sort(() => Math.random() - 0.5).slice(0, SESSION);
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));

// AI 해설 원문에 리터럴 "<br>"이 섞여 들어오는 카드가 있다. 이스케이프하면 글자로
// 보이고 그대로 두면 주입 통로가 된다 — 줄바꿈으로만 되살린다.
const escBr = (s) => String(s == null ? '' : s).split(/<br\s*\/?>/i).map(esc).join('<br>');

function renderDots(){
  $('dots').innerHTML = deck.map((_, i) => '<div class="dot ' + (results[i] || '') + '"></div>').join('');
}

function render(){
  const c = deck[idx];
  if (!c) return finish();
  const weak = gradeOf(c) === 'dunno';
  $('card').classList.toggle('bonus', weak);
  $('front').innerHTML =
    (weak ? '<div class="chip">다시 만남</div>' : '') +
    '<p class="en">' + esc(c.front) + '</p>' +
    (c.context ? '<p class="ctx">' + esc(c.context) + '</p>' : '') +
    '<div class="tapcue"><i></i>탭하면 뜻</div>';
  $('back').className = 'back';
  $('back').innerHTML = '';
  reveal = 0;
  renderDots();
  $('streak').textContent = streak;
}

function doReveal(){
  const c = deck[idx];
  if (reveal === 0){
    reveal = 1;
    $('front').querySelector('.tapcue')?.remove();
    $('back').className = 'back on';
    $('back').innerHTML =
      '<p class="hint">' + escBr(c.hint || '(뜻 없음)') + '</p>' +
      (c.detail?.length ? '<button class="more" id="more">해설 더 보기</button>' : '') +
      (c.url ? '<a class="src" href="' + esc(c.url) + '" target="_blank" rel="noopener">원본 쇼츠 &#8599;</a>' : '');
    $('more')?.addEventListener('click', (e) => { e.stopPropagation(); doReveal(); });
  } else if (reveal === 1){
    reveal = 2;
    $('more')?.remove();
    const d = document.createElement('div');
    d.className = 'detail';
    d.innerHTML = c.detail.map((t) => '<p>' + escBr(t) + '</p>').join('');
    $('back').insertBefore(d, $('back').querySelector('.src'));
  }
}

// 채점은 화면을 막지 않는다 — 먼저 넘기고, 서버 기록은 뒤에서 따라간다.
function grade(g){
  const c = deck[idx], k = keyOf(c);
  grades[k] = { grade: g, n: (grades[k]?.n || 0) + 1, at: Date.now() };
  local.set('sd_cache', { cards: CARDS, grades, at: Date.now() });
  results[idx] = g;
  streak = (g === 'know') ? streak + 1 : 0;

  pending++;
  fetch('/api/grade', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pageId: c.id, key: k, grade: g })
  }).catch(() => {}).finally(() => { pending--; });

  idx++;
  if (idx >= deck.length) return finish();
  render();
}

function finish(){
  const n = (g) => results.filter((x) => x === g).length;
  $('tally').innerHTML = [['know','이해'],['fuzzy','애매'],['dunno','모름']]
    .map(([k, l]) => '<div><span style="color:var(--' + k + ')">' + n(k) + '</span><em>' + l + '</em></div>').join('');
  $('sync').textContent = pending ? '기록 저장 중…' : 'Notion에 기록됨';
  $('done').classList.add('on');
}

$('again').addEventListener('click', () => {
  $('done').classList.remove('on');
  deck = buildDeck(); idx = 0; results = []; streak = 0;
  render();
});

/* ── 제스처 ─────────────────────────────────────────────── */
const card = $('card'), wash = $('wash'), verdict = $('verdict');
const TH = 88;
let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false, lockH = false;

const upGrade = () => reveal === 0 ? ['know','이해','var(--know)'] : ['dunno','모름','var(--dunno)'];
const rightGrade = () => ['fuzzy','애매','var(--fuzzy)'];

function show(color, label, t){
  wash.style.background = 'radial-gradient(120% 80% at 50% 50%, color-mix(in srgb, ' + color + ' 26%, transparent), transparent 72%)';
  wash.style.opacity = t;
  verdict.textContent = label;
  verdict.style.color = color;
  verdict.style.opacity = t;
  verdict.style.transform = 'translate(-50%,-50%) scale(' + (0.85 + t * 0.15) + ')';
}
const hide = () => { wash.style.opacity = 0; verdict.style.opacity = 0; };

card.addEventListener('pointerdown', (e) => {
  if ($('done').classList.contains('on') || $('loading').classList.contains('on')) return;
  lockH = !!e.target.closest('.detail');
  dragging = true; moved = false;
  sx = e.clientX; sy = e.clientY; dx = 0; dy = 0;
  card.setPointerCapture(e.pointerId);
  card.style.transition = 'none';
});

card.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dx = e.clientX - sx;
  dy = lockH ? 0 : e.clientY - sy;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
  card.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx * 0.025) + 'deg)';

  const vert = Math.abs(dy) > Math.abs(dx);
  const t = Math.min(Math.max(Math.abs(dx), Math.abs(dy)) / TH, 1);
  if (!lockH && dy < -30 && vert){ const g = upGrade(); show(g[2], g[1], t); }
  else if (dx > 30 && !vert){ const g = rightGrade(); show(g[2], g[1], t); }
  else if (dx < -30 && !vert && idx > 0){ show('#8B95A3', '되돌리기', t); }
  else hide();
});

card.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false; hide();
  card.style.transition = 'transform .22s cubic-bezier(.2,.7,.3,1)';
  if (!moved){ card.style.transform = ''; doReveal(); return; }

  const vert = Math.abs(dy) > Math.abs(dx);
  const up = !lockH && dy < -TH && vert;
  const right = dx > TH && !vert;
  const left = dx < -TH && !vert;

  if (up || right){
    const g = up ? upGrade() : rightGrade();
    card.style.transform = up ? 'translateY(-120%)' : 'translateX(120%)';
    setTimeout(() => { card.style.transition = 'none'; card.style.transform = ''; grade(g[0]); }, 180);
  } else if (left && idx > 0){
    card.style.transform = 'translateX(120%)';
    setTimeout(() => {
      card.style.transition = 'none'; card.style.transform = '';
      idx--; results[idx] = undefined; streak = 0; render();
    }, 180);
  } else {
    card.style.transform = '';
  }
});

card.addEventListener('pointercancel', () => { dragging = false; hide(); card.style.transform = ''; });

/* ── 시작 ───────────────────────────────────────────────── */
load().then((src) => {
  if (!CARDS.length){ $('loadmsg').textContent = '카드가 없음 — Notion DB를 확인'; return; }
  $('loading').classList.remove('on');
  deck = buildDeck();
  render();
  if (src !== 'notion') console.warn('[ShortsDeck] 대체 데이터 사용:', src);
}).catch((e) => {
  $('loadmsg').textContent = '불러오기 실패 — ' + e.message;
});
</script>
</body>
</html>
