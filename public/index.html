<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B0D10">
<title>Shorts Deck</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0B0D10; --ink2:#151A20; --ink3:#1E252D; --ink4:#262E38;
    --paper:#EFF2F6; --body-text:#C9D1DC; --muted:#8B95A3; --faint:#5A6472;
    --know:#3DD68C; --coral:#FF8F6B;
    /* 글자 크기 배율 — 인라인 스타일이 아니라 변수로 둔다. #content 하나에만 인라인으로
       걸면 스와이프로 들어오는 peek(.content 클래스만 있고 인라인은 없음)이 기본 크기로
       그려졌다가 커밋 후 설정 크기로 튄다(2026-09-05 실기기 피드백). 변수면 같은 CSS
       규칙을 공유하므로 튐이 원리적으로 불가능하다. */
    --tscale:1; --bscale:1;
    /* 하단 바의 실제 높이. JS가 ResizeObserver로 실측해 덮어쓴다(아래는 첫 페인트용 근사값).
       본문 영역이 이 값만큼 위에서 끝나므로, 계산식이 실제와 어긋나면 바로 티가 난다. */
    --barh:92px;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  /* overflow:hidden;position:fixed로 문서 자체를 스크롤 불가능하게 완전히 잠근다 —
     overscroll-behavior:none만으로는 iOS Safari의 문서 레벨 러버밴드 바운스를 확실히
     못 막아, 화면 최상단에서 아래로 당기면 #app 하위 요소 중 자체 스크롤 컨텍스트가
     없는 것들(.bottombar 등)만 딸려 내려가 보이는 증상이 있었다(2026-09-05). */
  html,body{height:100%;overflow:hidden;position:fixed;inset:0}
  body{
    margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--know);outline-offset:2px}

  #app{
    position:fixed;inset:0;height:100dvh;overflow:hidden;
    max-width:520px;margin:0 auto;background:var(--ink);
    -webkit-user-select:none;user-select:none;
  }
  #readRoot,#examView{position:absolute;inset:0}
  #readRoot[hidden],#examView[hidden]{display:none}

  /* ── 학습(읽기) 화면 — 홈 화면 자체. 본문과 컨트롤을 「두 그룹으로 분리」한다:
     본문은 스크러버 바로 위에서 끝나고, 그 아래는 컨트롤 전용 구역이다.
     예전엔 본문이 화면 전체를 쓰고 컨트롤이 반투명 오버레이로 그 위에 떠 있었는데,
     바 배경 그라데이션(하단 40%가 92% 불투명)이 그 뒤 텍스트를 어차피 못 읽게 만들어
     「죽은 공간」이었고, 반쯤 비치는 글자가 스크러버·버튼과 섞여 오히려 헷갈렸다.
     클립으로 잃는 실질 가독 영역은 거의 없고(≈750px로 동일), 대신 바를 안전 하한까지
     내려 실제로는 넓어진다(2026-09-05 라운드6 사용자 판단). ── */
  .stage{position:absolute;top:0;left:0;right:0;bottom:var(--barh)}
  /* clip-path로 상태바 안전영역 위쪽을 물리적으로 잘라낸다 — apple-mobile-web-app-status-bar-style
     메타태그는 viewport-fit=cover가 걸린 최신 iOS에서 아이콘 색만 바꿀 뿐 레이아웃 공간을
     예약하지 않아서(실기기 스샷으로 확인, 2026-09-05), 긴 제목·본문이 스크롤로 상태바
     뒤까지 올라가는 걸 못 막았다. 스크롤 컨테이너 자체를 잘라내는 쪽이 확실하다. */
  .scroller{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
    -webkit-user-select:text;user-select:text;
    clip-path:inset(env(safe-area-inset-top) 0 0 0);
  }
  .cardtitle{
    display:block;font-family:var(--serif);font-weight:400;
    font-size:calc(clamp(22px,6vw,30px) * var(--tscale));line-height:1.18;letter-spacing:-.01em;
    color:var(--paper);text-decoration:none;text-wrap:balance;
    padding:calc(env(safe-area-inset-top) + 62px) 22px 6px;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  }
  /* 본문 영역 자체가 바 위에서 끝나므로(.stage) 하단 패딩은 마지막 줄이 경계선에 닿지
     않을 만큼만 있으면 된다 — 예전 92px는 바를 피하려던 값이라 이제 불필요하다. */
  .content{
    padding:6px 20px 18px 20px;min-height:100%;
    font-size:calc(15.5px * var(--bscale));line-height:1.7;color:var(--body-text);
    will-change:transform;
  }
  .peek{position:absolute;inset:0;pointer-events:none;will-change:transform;display:flex;flex-direction:column;overflow:hidden;z-index:1}
  .peek-prev{transform:translateX(-100%)}
  .peek-next{transform:translateX(100%)}
  .peek .cardtitle{padding:calc(env(safe-area-inset-top) + 62px) 22px 6px;color:var(--paper)}
  /* 아래쪽을 흐리게 하던 마스크는 제거 — 커밋 후 마스크 없는 실제 카드로 바뀌는 순간
     "가려져 있다가 나타나는" 것처럼 보인다는 실기기 피드백(2026-09-05). 처음부터 다
     보이는 쪽이 낫다. */
  .peekbody{flex:1;min-height:0}
  .content p{margin:0 0 12px}
  .content h3{font-family:var(--serif);font-weight:400;font-size:1.3em;color:var(--paper);margin:20px 0 8px}
  .content h4{font-family:var(--serif);font-weight:400;font-size:1.15em;color:var(--paper);margin:16px 0 6px}
  .content h5{font-size:1em;margin:12px 0 4px;color:var(--paper);font-weight:600}
  .content ul,.content ol{margin:2px 0 12px;padding-left:20px}
  .content li{margin:3px 0}
  .content blockquote{border-left:2px solid var(--coral);padding-left:12px;margin:6px 0 12px;color:var(--faint);font-style:italic}
  .content .callout{background:var(--ink3);border-radius:10px;padding:10px 12px;margin:4px 0 12px}
  .content hr{border:0;border-top:1px solid var(--ink3);margin:10px 0}
  .content pre{background:var(--ink3);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:4px 0 12px}
  .content pre code{background:none;color:var(--paper);padding:0}
  .content .hl{background:var(--coral);color:var(--ink);padding:.04em .4em;border-radius:4px;font-family:var(--mono);font-size:.88em;font-weight:600;white-space:nowrap}
  .content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.87em}
  .content th,.content td{border:1px solid var(--ink4);padding:6px 8px;text-align:left;vertical-align:top}
  .content th{color:var(--coral);font-weight:500;background:color-mix(in srgb,var(--coral) 7%,transparent)}
  .content .lhint{font-size:1.08em;font-weight:600;color:var(--paper);margin:0 0 14px}
  .content .src{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none;border-bottom:1px solid var(--ink3);padding-bottom:2px;margin-top:4px}
  .content .shot{max-width:100%;border-radius:10px;display:block;margin:6px 0 12px;cursor:zoom-in;-webkit-touch-callout:none}
  .content .shotcap{font-family:var(--mono);font-size:11px;color:var(--muted);margin:-6px 0 12px}

  /* ── 상단: 챕터-소챕터 주소("1-1") — 탭하면 이 소챕터 시험. 점 5개(소챕터 10장 기준
     2장당 1점)가 이 소챕터에서 몇 장을 "안다"로 판정했는지 보여준다. 원형 진행률 링에서
     캡슐형으로 교체(2026-09-05 디자인 베이크오프 라운드4 — "원그래프보다 공간 덜 차지"). ── */
  .subpos{
    position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:2;
    display:flex;justify-content:center;padding:8px 0 0;
  }
  .subpos-chip{
    height:26px;padding:0 12px;border-radius:13px;border:0;cursor:pointer;
    background:var(--ink3);display:flex;align-items:center;gap:7px;-webkit-touch-callout:none;
  }
  .subpos-chip span#subPos{font-family:var(--mono);font-size:11px;color:var(--paper);font-weight:600}
  .subpos-dots{display:flex;gap:3px}
  .subpos-dots[hidden]{display:none}
  .subpos-dots i{width:6px;height:6px;border-radius:50%;background:var(--ink4);display:block}
  .subpos-dots i.on{background:var(--coral)}
  .subpos-dots i.half{background:linear-gradient(90deg,var(--coral) 50%,var(--ink4) 50%)}
  .subpos-chip:active{transform:scale(.95)}
  /* 경계 전환이 매끄러워질수록 "언제 소챕터가 바뀌었는지" 알기 어려워진다 — 별도 전환
     화면을 넣는 대신(무마찰 원칙) 주소 칩만 짧게 튀어 알린다. */
  @keyframes subposflash{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
  .subpos-chip.flash{animation:subposflash .42s ease}

  /* ── 검색(2026-09-06) — 상단 주소 칩이 가운데 정렬이라 좌우 코너가 비어 있음(사용자 제안:
     우상단). 오버레이는 시트와 별개(같은 z 레이어 뒤섞이지 않게 상단만 덮는 형태). ── */
  .searchbtn{
    position:absolute;top:env(safe-area-inset-top);right:0;z-index:3;margin:5px 8px 0 0;
    width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
    background:var(--ink3);color:var(--muted);display:flex;align-items:center;justify-content:center;
    -webkit-touch-callout:none;
  }
  /* ── 2026-09-06 라운드14: 하단바에 있던 폰트 버튼을 상단으로(본문 보며 조절하려는데
     버튼이 하단에 있으면 손이 멀다는 지적) — 검색 아이콘 옆에 배치. 시험 버튼은 좌상단
     (상단 "1-1" 칩은 이제 목록 보기 전용으로 바뀌어 시험 진입이 별도 자리가 필요해짐). ── */
  .fontbtn-top{
    position:absolute;top:env(safe-area-inset-top);right:44px;z-index:3;margin:5px 0 0;
    width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
    background:var(--ink3);color:var(--muted);display:flex;align-items:center;justify-content:center;
    -webkit-touch-callout:none;font-family:var(--serif);font-size:13px;
  }
  .examtopbtn{
    position:absolute;top:env(safe-area-inset-top);left:0;z-index:3;margin:5px 0 0 8px;
    width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
    background:var(--ink3);color:var(--muted);display:flex;align-items:center;justify-content:center;
    -webkit-touch-callout:none;
  }
  .examtopbtn svg,.fontbtn-top svg{width:16px;height:16px;stroke:currentColor}
  .examtopbtn[hidden]{display:none}
  .searchov{
    position:fixed;inset:0;z-index:12;background:var(--ink);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  .searchov[hidden]{display:none}
  .searchbar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px}
  .searchbar input{
    flex:1;background:var(--ink3);border:0;border-radius:10px;color:var(--paper);
    font-family:var(--sans);font-size:15px;padding:11px 13px;outline:none;
  }
  .searchbar button{flex:none;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
  .searchresults{flex:1;overflow-y:auto;padding:2px 14px 24px;-webkit-overflow-scrolling:touch}
  /* 챕터/소챕터 "제목 리스트" 화면(2026-09-06 라운드14) — 검색 오버레이와 같은 뼈대
     (.searchov/.searchbar/.searchresults)를 그대로 재사용, 입력창 대신 제목 텍스트만. */
  .listovtitle{flex:1;font-family:var(--serif);font-size:16px;color:var(--paper);padding:6px 4px}

  /* ── 챕터 완주 넛지 배너 ── */
  .chapnudge{
    position:absolute;left:16px;right:16px;bottom:calc(var(--barh) + 12px);z-index:3;
    background:color-mix(in srgb,var(--ink2) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    display:flex;flex-direction:column;gap:8px;
    opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .22s ease,transform .22s ease;
  }
  .chapnudge.on{opacity:1;pointer-events:auto;transform:translateY(0)}
  .chapnudge p{margin:0;font-size:13px;color:var(--paper)}
  .chapnudge .row{display:flex;gap:8px}
  .chapnudge button{flex:1;border:0;border-radius:9px;padding:9px;font-size:12.5px;cursor:pointer;background:var(--ink4);color:var(--body-text)}
  .chapnudge button.primary{background:color-mix(in srgb,var(--coral) 22%,var(--ink4));color:var(--coral)}

  /* ── 하단 플로팅 바: 스크러버 + 필터/형광펜/시트 ── 본문 위에 떠서 엄지 반경을 채운다.
     시험 버튼은 자주 안 쓰는 액션이라 상단 "1-1" 칩으로 옮겼다 — 엄지 영역은 자주 쓰는
     것만(2026-09-05 실기기 피드백: "하단은 오른손 엄지 영역이 비싼 부동산"). ── */
  .bottombar{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:4px 16px max(4px, calc(env(safe-area-inset-bottom) - 28px));
    background:var(--ink);
  }
  .scrubber{padding:0 4px 2px;touch-action:none}
  .scrubtrack{position:relative;height:14px}
  .scrubtrack .track{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--ink4);transform:translateY(-50%);border-radius:2px}
  .scrubtrack .dot{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:var(--faint);transform:translate(-50%,-50%);transition:background-color .1s ease}
  .scrubtrack .dot.cur{background:var(--coral);width:10px;height:10px}
  /* 스크러버 위치는 그대로 두고 버튼 행만 더 아래로 밀기 위해, 줄어든 바깥 여백(위)만큼
     여기 margin-top으로 다시 넣어준다 — 순 이동분은 버튼~화면끝 간격에만 반영되고
     스크러버~버튼 간격은 오히려 넓어진다(2026-09-05 실기기 피드백: "너무 붙어 보임"). */
  .barrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
  /* 필터 — 예전엔 전체/미완료 2버튼 세그먼트였으나 결국 이진 토글이라 하나로 단순화
     (2026-09-05 디자인 베이크오프 라운드4, 콘셉트 3안 전부 "애매" 판정 후 대안 채택). */
  .filtertoggle{
    flex:none;height:34px;padding:0 14px;border:0;border-radius:17px;cursor:pointer;
    background:var(--ink3);color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:500;
    -webkit-touch-callout:none;
  }
  .filtertoggle.on{background:var(--ink4);color:var(--paper)}
  .barr-icons{display:flex;align-items:center;gap:8px}
  .barbtn{
    flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    background:var(--ink3);color:var(--muted);-webkit-touch-callout:none;
  }
  .barbtn:active{transform:scale(.93)}
  .barbtn.active{background:color-mix(in srgb,var(--coral) 30%,var(--ink3));color:var(--coral)}
  .barbtn svg{width:18px;height:18px;stroke:currentColor}
  /* 아이콘 선 색은 "무슨 버튼인가"를 알려주는 정체성이라 꺼져 있어도 유지한다(형광펜=코랄,
     안다=초록). 켜짐/꺼짐 구분은 채도와 배경 틴트가 진다 — 색을 상태에만 쓰는 원칙과
     충돌하지 않는다(2026-09-05 실기기 피드백: "체크버튼에 색이 없다"). */
  #hlBtn{color:color-mix(in srgb,var(--coral) 60%,var(--muted))}
  /* "안다" 퀵버튼 — 원형 아이콘 전용으로 교체(2026-09-05 베이크오프 라운드4 — "초록 체크에
     글씨 없이 깔끔해서 좋음"). 탭=안다, 롱프레스=보관/휴지통 팝업은 그대로. */
  .knowbtn{
    flex:none;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink3);color:color-mix(in srgb,var(--know) 60%,var(--muted));-webkit-touch-callout:none;
  }
  .knowbtn svg{width:20px;height:20px;stroke:currentColor}
  .knowbtn:active{transform:scale(.93)}
  .knowbtn.on{background:color-mix(in srgb,var(--know) 24%,var(--ink3));color:var(--know)}
  /* 완전히 앎/휴지통 카드뷰(reviewMode)에서는 체크 아이콘이 "복구" 역할로 바뀐다 —
     코랄로 색을 바꿔 평소 안다 버튼(초록)과 구분한다. 아이콘 모양도 체크(✓)가 아니라
     되돌리기 화살표로 바꾼다(2026-09-06 사용자 지적 — "복구인데 체크 모양은 헷갈림"). */
  .knowbtn.reviewing{color:var(--coral)}
  .knowbtn.reviewing.on{background:color-mix(in srgb,var(--coral) 24%,var(--ink3));color:var(--coral)}
  .knowbtn .ic-restore{display:none}
  .knowbtn.reviewing .ic-check{display:none}
  .knowbtn.reviewing .ic-restore{display:block}
  /* 평소 읽기화면 하단바에 휴지통/완전히앎을 상시 노출(2026-09-06 라운드14 — 롱프레스
     메뉴 폐기, 오른손 엄지에 가까운 안다 버튼 옆에 작게 배치. 왼쪽부터 휴지통→완전히앎→
     안다 순서: 자주 쓰는 안다가 제일 오른쪽/제일 가까움). reviewMode에선 의미가 없어 숨김. */
  .quickbtn[hidden]{display:none}
  /* reviewMode(완료/휴지통 카드뷰)에선 filterToggle이 숨어 아이콘 그룹만 남는데, 부모
     .barrow의 justify-content:space-between이 자식 1개일 땐 왼쪽으로 붙여버린다
     (2026-09-06 사용자 지적 — 직접 확인함). 오른쪽(엄지 영역)으로 모은다. */
  .bottombar.reviewbar .barrow{justify-content:flex-end}
  .knowpop{
    position:absolute;left:16px;right:16px;bottom:calc(var(--barh) - 4px);z-index:4;
    background:color-mix(in srgb,var(--ink2) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    display:flex;flex-direction:column;gap:6px;
  }
  .knowpop[hidden]{display:none}
  .knowpop button{border:0;background:var(--ink4);color:var(--paper);border-radius:9px;padding:12px;font-size:13px;cursor:pointer;text-align:left}
  .knowpop button.trash{color:var(--coral)}
  /* 폰트 팝업 — 챕터 시트에서 분리된 뒤로도 .knowpop(하단 고정)을 그대로 썼는데, 본문을
     보며 조절하려는 용도엔 화면 중앙이 낫고 줄 간격(6px)도 너무 좁다는 지적(2026-09-06).
     ID 선택자라 위 .knowpop보다 우선순위가 높아 안전하게 겹쳐 쓸 수 있다. */
  #fontPop{
    position:fixed;left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:min(440px,86vw);background:color-mix(in srgb,var(--ink2) 90%,transparent);
    gap:22px;padding:20px 18px;
  }

  /* ── 제목 롱프레스 → 그 자리에서 바로 편집 — 메뉴·입력창 팝업 둘 다 폐기했다
     (2026-09-05 사용자 요청: 단계를 줄이자). .cardtitle 타이포는 그대로 물려받고
     입력 관련 속성만 여기서 뒤집는다. [hidden] 규칙은 별도 명시가 필요하다 —
     .cardtitle이 display:block이라 author 스타일이 UA 기본 규칙을 이긴다(이 프로젝트
     에서 .navbtn·.examjudge·#viewStudy·.lightbox로 이미 네 번 밟은 함정). ── */
  .cardtitle-input{
    width:100%;box-sizing:border-box;background:transparent;border:0;
    border-bottom:1px solid var(--coral);outline:0;
    -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
  }
  /* .cardtitle 자체가 display:block이라 이 규칙이 없으면 [hidden]이 안 먹는다 —
     #cardTitle과 #cardTitleInput 둘 다 이 클래스를 쓰므로 하나로 같이 잡는다. */
  .cardtitle[hidden]{display:none}

  .toast{position:fixed;left:50%;bottom:calc(var(--barh) + 18px);transform:translate(-50%,8px);z-index:8;font-family:var(--mono);font-size:12.5px;color:var(--paper);background:var(--ink3);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .loadbox{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ink)}
  .loadbox[hidden]{display:none}
  .loadbox h2{font-family:var(--serif);font-weight:300;font-size:22px;margin:0;color:var(--paper)}
  .loadbox p{margin:0;color:var(--muted);font-size:13px}
  .loadbox button{margin-top:6px;background:var(--ink3);color:var(--paper);border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}

  /* ── 시험(exam) ── */
  #examView{display:flex;flex-direction:column}
  .examtop{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
  .examtop button{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink3);color:var(--muted);cursor:pointer;font-size:16px;flex:none}
  .examtop .ttl{flex:1;text-align:center;font-family:var(--serif);font-size:15px;color:var(--paper)}
  .examwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 22px}
  .examprog{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);padding:6px 0 0;text-align:center}
  .examcard{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;overflow-y:auto}
  .examtitle{font-family:var(--serif);font-size:clamp(24px,7vw,32px);line-height:1.25;color:var(--paper);text-align:center;text-wrap:balance}
  .examreveal{align-self:center;background:var(--ink3);color:var(--coral);border:0;border-radius:99px;padding:13px 26px;font-family:var(--sans);font-size:14px;cursor:pointer}
  .examreveal:active{background:var(--ink4)}
  .exambody{min-height:0;max-height:44vh;overflow-y:auto;-webkit-user-select:text;user-select:text}
  .examjudge{display:flex;gap:10px;padding:6px 0 22px;flex:none}
  .examjudge[hidden]{display:none}
  .examjudge button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-family:var(--sans);font-size:14px;cursor:pointer}
  .examjudge .know{background:color-mix(in srgb,var(--know) 20%,var(--ink3));color:var(--know)}
  .examjudge .dontknow{background:color-mix(in srgb,var(--coral) 16%,var(--ink3));color:var(--coral)}

  .examresult{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:0 24px;text-align:center}
  .examresult .score{font-family:var(--serif);font-size:34px;color:var(--paper)}
  .examresult .best{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .examresult .actions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
  .examresult button{background:var(--ink3);color:var(--paper);border:0;border-radius:10px;padding:13px;font-family:var(--sans);font-size:13.5px;cursor:pointer}
  .examresult button.primary{background:color-mix(in srgb,var(--coral) 20%,var(--ink3));color:var(--coral)}

  /* ── 하단 시트: 챕터 목록 + 설정 ── */
  .sheetback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;opacity:0;pointer-events:none;transition:opacity .22s ease}
  .sheetback.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:11;
    background:var(--ink2);border-radius:18px 18px 0 0;max-height:58dvh;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 30px rgba(0,0,0,.4);
  }
  .sheet.on{transform:translateY(0)}
  /* 시각적으로는 얇은 막대지만 히트박스는 시트 폭 전체 × 46px다 — 예전엔 72×26px여서
     주석만 "넓다"고 적혀 있고 실제로는 좁았다(2026-09-05 실기기 피드백: 드래그로 닫기가
     계속 안 됨). touch-action:none은 이 영역 전체에 걸려야 iOS가 터치를 네이티브
     스크롤/바운스로 먼저 채가지 않는다.
     ⚠ 제스처 하나에만 닫기를 걸지 않는다 — 데스크톱 합성 이벤트로는 이 경합이 재현되지
     않아 검증이 불가능하므로, 항상 통하는 탈출구로 ✕ 버튼을 함께 둔다. */
  .sheethandle{width:100%;height:46px;flex:none;position:relative;cursor:grab;touch-action:none}
  .sheethandle::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:4px;background:var(--ink4);border-radius:3px}
  .sheetclose{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
    background:var(--ink3);color:var(--muted);font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;-webkit-touch-callout:none;
  }
  .sheetclose:active{background:var(--ink4)}
  /* overscroll-behavior:contain — 목록 끝에서 바운스가 터치를 삼켜 드래그가 죽는 것을 막는다. */
  .sheetscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
  .chaplist{padding:6px 16px 10px;display:flex;flex-direction:column;gap:10px}
  /* 챕터 행 — 칩 전체를 탭하면 "그 챕터 카드 제목 리스트"가 먼저 뜨고, 거기서 고른
     제목으로 이동한다(2026-09-06 라운드14 — 예전엔 칩 탭이 곧장 이동이었다). "전체시험"만
     별도 미니 버튼으로 즉시 실행. */
  /* 2026-09-06 라운드15(베이크오프 R4 채택): "최고 N"을 별도 줄(라운드14)에서 점수 옆
     작은 트로피 배지로 합쳐 2줄 구조로 압축했다. "최고 N"은 실시간 안다 개수의 역대
     최고치라 평소엔 현재 점수와 거의 항상 같은 값이지만(안다 표시는 늘어나기만 함),
     시험에서 "몰랐음"으로 정직하게 답하면 현재 점수만 내려가고 최고는 그대로 남는
     유일한 경우가 있어 — 그 정직한 하향이 "손해"처럼 안 보이게 지키는 값이라 상시
     표시를 유지한다(CLAUDE.md 참조). 전체시험 버튼은 폭이 최고 자릿수에 안 흔들리게
     라벨을 그대로 "전체시험"으로 고정 — 상태 표시(점수+트로피)와 액션(버튼)을 분리한다. */
  .chaprow{background:var(--ink3);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
  .chaprow:active{background:var(--ink4)}
  .chaprow-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chaprow-label{display:flex;flex-direction:column;gap:1px}
  .chaprow-label b{font-family:var(--serif);font-weight:400;font-size:15px;color:var(--paper)}
  .chaprow-range{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .chaprow-scorewrap{display:flex;align-items:center;gap:8px;flex:none}
  .chaprow-score{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--paper);font-variant-numeric:tabular-nums;flex:none;text-align:right;white-space:nowrap}
  .chaprow-best{display:flex;align-items:center;gap:3px;flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chaprow-best svg{width:11px;height:11px;stroke:currentColor;flex:none}
  .chaprow-bar{height:4px;border-radius:2px;background:var(--ink4);overflow:hidden}
  .chaprow-bar i{display:block;height:100%;background:var(--coral);border-radius:2px}
  .chaprow-exam{flex:none;white-space:nowrap;background:var(--ink4);border:0;border-radius:9px;color:var(--coral);font-family:var(--sans);font-size:11px;padding:6px 9px;cursor:pointer}
  .trashsec{padding:4px 16px 18px}
  .trashrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink3);border-radius:10px;padding:10px 12px;margin-top:6px}
  .trashrow .tn{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:20px;text-align:right;font-variant-numeric:tabular-nums}
  .trashrow .tf{flex:1;font-family:var(--serif);font-size:14px;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trashrow .ta{display:flex;gap:6px;flex:none;align-items:center}
  .trashrow .ta button{background:var(--ink4);border:0;border-radius:7px;color:var(--body-text);font-size:11px;padding:6px 8px;cursor:pointer}
  .trashrow .ta button.del{color:var(--coral)}
  /* 검색 결과 상태 배지(2026-09-06) — .trashrow/.ta를 그대로 재사용, 배지만 추가 */
  .searchbadge{font-family:var(--sans);font-size:10.5px;color:var(--muted);background:var(--ink4);border-radius:6px;padding:4px 7px;white-space:nowrap}
  .searchbadge.s-known{color:var(--know)}
  .searchbadge.s-archive{color:var(--coral)}
  .searchbadge.s-trash{color:var(--muted)}
  .sliderow{display:flex;align-items:center;gap:10px}
  .sliderow label{flex:none;width:38px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .sliderow input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;outline:none;background:linear-gradient(to right,var(--coral) 0%,var(--coral) var(--fill,50%),var(--ink4) var(--fill,50%),var(--ink4) 100%)}
  .sliderow input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--coral);cursor:pointer;border:2px solid var(--ink)}
  .sliderow input[type="range"]::-moz-range-track{height:6px;border-radius:999px;background:var(--ink4)}
  .sliderow input[type="range"]::-moz-range-progress{height:6px;border-radius:999px;background:var(--coral)}
  .sliderow input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--coral);border:2px solid var(--ink);cursor:pointer}
  .sliderow .val{flex:none;width:38px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ── 이미지 확대(라이트박스) ── 본문 스크린샷을 탭하면 전체화면으로 띄우고 핀치·더블탭으로
     확대한다. 페이지 자체는 maximum-scale=1이라 브라우저 핀치줌이 막혀 있어, 여기서만
     transform으로 직접 구현한다. #app 밖(body 직속)에 두는 이유는 #app의 position:fixed·
     user-select:none 제약을 물려받지 않기 위해서다(시트와 같은 이유).
     ⚠ [hidden]에 display:none을 따로 명시 — author의 display:flex가 UA 기본 규칙을 이긴다. */
  .lightbox{
    position:fixed;inset:0;z-index:20;background:#000;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  .lightbox[hidden]{display:none}
  .lightbox img{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform}
  .lbclose{
    position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:21;
    width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(30,37,45,.92);color:var(--paper);font-size:15px;
    display:flex;align-items:center;justify-content:center;-webkit-touch-callout:none;
  }
  .lbhint{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:21;
    font-family:var(--mono);font-size:10.5px;color:var(--faint);pointer-events:none;white-space:nowrap;
  }

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="readRoot">
    <div class="stage" id="stage">
      <div class="scroller" id="scroller">
        <a class="cardtitle" id="cardTitle" href="#" target="_blank" rel="noopener"></a>
        <input class="cardtitle cardtitle-input" id="cardTitleInput" type="text" autocomplete="off" hidden>
        <div class="content" id="content"></div>
      </div>
      <div class="peek peek-prev" id="peekPrev"><div class="cardtitle" id="peekPrevTitle"></div><div class="content peekbody" id="peekPrevBody"></div></div>
      <div class="peek peek-next" id="peekNext"><div class="cardtitle" id="peekNextTitle"></div><div class="content peekbody" id="peekNextBody"></div></div>
      <div class="subpos"><button class="subpos-chip" id="subPosChip" aria-label="이 소챕터 카드 목록"><span id="subPos">1-1</span><span class="subpos-dots" id="subPosDots"><i></i><i></i><i></i><i></i><i></i></span></button></div>
      <!-- 2026-09-06 라운드14: "1-1" 칩 탭이 시험에서 "목록 보기"로 바뀌면서, 시험 진입은
           좌상단 전용 아이콘으로 옮겼다. 우상단은 검색+폰트(둘 다 "화면 보조" 성격이라 묶음). -->
      <button class="examtopbtn" id="subExamBtn" aria-label="이 소챕터 시험보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
      <button class="fontbtn-top" id="fontBtn" aria-label="글자 크기">Aa</button>
      <button class="searchbtn" id="searchOpenBtn" aria-label="검색"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    </div>

    <div class="chapnudge" id="chapNudge">
      <p id="chapNudgeText"></p>
      <div class="row"><button id="chapNudgeSkip">다음 챕터로 계속</button><button class="primary" id="chapNudgeGo">지금 전체시험 보기</button></div>
    </div>

    <!-- 트래시 카드뷰 롱프레스 전용 "완전삭제" 확인 하나만 남았다(2026-09-06 라운드14 —
         평소 보관/휴지통 갈림길은 하단바 상시 버튼으로 옮겨 이 팝업 자체가 필요 없어짐). -->
    <div class="knowpop" id="knowPop" hidden>
      <button class="trash" id="reviewDeleteBtn">🗑 완전삭제(되돌릴 수 없음)</button>
    </div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
const escBr = (s) => String(s == null ? '' : s).split(/<br\s*\/?>/i).map(esc).join('<br>');
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function lsGetJSON(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }
function lsSetJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ── 원본 블록 렌더링(서버가 압축해 보낸 Notion 블록을 표시 시점에 그린다) ── */
function richHtml(rich){
  return (rich || []).map((t) => {
    let s = esc(t.t);
    if (t.code) s = '<code class="hl">' + s + '</code>';
    if (t.bold) s = '<b>' + s + '</b>';
    if (t.italic) s = '<i>' + s + '</i>';
    if (t.strike) s = '<s>' + s + '</s>';
    if (t.underline) s = '<u>' + s + '</u>';
    if (t.href) s = '<a href="' + esc(t.href) + '" target="_blank" rel="noopener">' + s + '</a>';
    return s;
  }).join('');
}
function tableHtml(b){
  const rows = b.rows || [];
  return '<table>' + rows.map((row, ri) => {
    const tag = b.headerRow && ri === 0 ? 'th' : 'td';
    return '<tr>' + row.map((cell) => '<' + tag + '>' + richHtml(cell) + '</' + tag + '>').join('') + '</tr>';
  }).join('') + '</table>';
}
// 초창기(AI 도입 전) 메모는 스크린샷을 그대로 붙여넣은 카드가 있다 — Notion 자체 호스팅
// 이미지는 URL이 만료되므로 /api/image로 매번 새로 받는다(external은 고정 URL 그대로).
function imageSrc(b){ return b.external || ('/api/image?id=' + encodeURIComponent(b.id)); }
function imageHtml(b){
  const src = imageSrc(b);
  const cap = (b.caption || []).map((t) => t.t).join('');
  // loading="lazy" 없음 — 이미 우리가 다음/이전 카드일 때만 렌더하므로 브라우저가 또
  // 늦출 이유가 없다(2026-09-05: 지연의 진짜 원인은 /api/image가 표시 시점에야 Notion을
  // 다시 불러 프리사인드 URL을 받는 2홉 구조였다 — warmImages()로 미리 데워둔다).
  return '<img class="shot" src="' + esc(src) + '" alt="' + esc(cap || '메모 스크린샷') + '">'
    + (cap ? '<p class="shotcap">' + esc(cap) + '</p>' : '');
}
// 카드 안 image 블록의 실제 바이트를 미리 받아 브라우저 캐시에 데운다 — 소챕터
// 텍스트 프리페치(subCache)와 같은 정신, 대상만 이미지로 좁힌 것.
const warmedImages = new Set();
function warmImages(c){
  if (!c) return;
  const blocks = [];
  if (c.hint && c.hint.type === 'image') blocks.push(c.hint);
  if (Array.isArray(c.detail)) c.detail.forEach((b) => { if (b && b.type === 'image') blocks.push(b); });
  blocks.forEach((b) => {
    const src = imageSrc(b);
    if (warmedImages.has(src)) return;
    warmedImages.add(src);
    const img = new Image();
    img.src = src;
  });
}
function blockHtml(b, i){
  if (!b) return '';
  const blk = i == null ? '' : ' data-blk="' + i + '"';
  switch (b.type){
    case 'heading_1': return '<h3' + blk + '>' + richHtml(b.rich) + '</h3>';
    case 'heading_2': return '<h4' + blk + '>' + richHtml(b.rich) + '</h4>';
    case 'heading_3': return '<h5' + blk + '>' + richHtml(b.rich) + '</h5>';
    case 'bulleted_list_item': return '<li' + blk + '>' + richHtml(b.rich) + '</li>';
    case 'numbered_list_item': return '<li' + blk + '>' + richHtml(b.rich) + '</li>';
    case 'quote': return '<blockquote' + blk + '>' + richHtml(b.rich) + '</blockquote>';
    case 'callout': return '<div class="callout"' + blk + '>' + richHtml(b.rich) + '</div>';
    case 'to_do': return '<div>' + (b.checked ? '&#9745; ' : '&#9744; ') + richHtml(b.rich) + '</div>';
    case 'code': return '<pre><code>' + richHtml(b.rich) + '</code></pre>';
    case 'divider': return '<hr>';
    case 'table': return tableHtml(b);
    case 'image': return imageHtml(b);
    default: return b.rich ? '<p' + blk + '>' + richHtml(b.rich) + '</p>' : '';
  }
}
function blocksHtml(blocks){
  let html = '', open = null;
  (blocks || []).forEach((b, i) => {
    const isLi = b.type === 'bulleted_list_item' || b.type === 'numbered_list_item';
    const tag = b.type === 'numbered_list_item' ? 'ol' : 'ul';
    if (isLi){
      if (open !== tag){ if (open) html += '</' + open + '>'; html += '<' + tag + '>'; open = tag; }
    } else if (open){ html += '</' + open + '>'; open = null; }
    html += blockHtml(b, i);
  });
  if (open) html += '</' + open + '>';
  return html;
}
function hintHtml(c){
  if (c.hint == null) return null;
  if (typeof c.hint === 'string') return escBr(c.hint);
  if (c.hint.type === 'image') return null; // 힌트 자리엔 텍스트만(이미지면 detail 쪽에서 그림)
  return richHtml(c.hint.rich || []);
}
function detailHtml(c){
  if (!c.detail || !c.detail.length) return '';
  if (typeof c.detail[0] === 'string') return c.detail.map((t) => '<p>' + escBr(t) + '</p>').join('');
  return blocksHtml(c.detail);
}
function cardBodyHtml(c){
  const h = hintHtml(c);
  const hintIsImage = c.hint && c.hint.type === 'image';
  return (hintIsImage ? imageHtml(c.hint) : '') + (h ? '<p class="lhint" data-blk="hint">' + h + '</p>' : '') + detailHtml(c)
    + (c.url ? '<a class="src" href="' + esc(c.url) + '" target="_blank" rel="noopener">원본 쇼츠 &#8599;</a>' : '');
}
function peekBodyHtml(c){
  if (!c) return '';
  const h = hintHtml(c);
  const hintIsImage = c.hint && c.hint.type === 'image';
  return (hintIsImage ? imageHtml(c.hint) : '') + (h ? '<p class="lhint">' + h + '</p>' : '') + detailHtml(c);
}

/* ── 토스트 ── */
let toastT = null;
function toast(msg){
  clearTimeout(toastT);
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  toastT = setTimeout(() => t.classList.remove('on'), 1300);
}

/* ── API ── */
async function apiChapters(){ const r = await fetch('/api/chapters'); return r.json(); }
async function apiSubchapter(id, mode){ const r = await fetch('/api/subchapter?id=' + encodeURIComponent(id) + '&mode=' + mode); return r.json(); }
async function apiChapterExam(id){ const r = await fetch('/api/chapterexam?id=' + encodeURIComponent(id)); return r.json(); }
function apiAnswer(subId, key, know, pageId){
  return fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subId, key, know, pageId }) })
    .then((r) => r.json()).catch(() => null);
}
function apiPostKey(path, key, pageId){
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, pageId }) })
    .then((r) => r.json()).catch(() => null);
}
const apiArchive = (key, pageId) => apiPostKey('/api/archive', key, pageId);
const apiArchiveRestore = (key, pageId) => apiPostKey('/api/archive/restore', key, pageId);
const apiArchiveToTrash = (key, pageId) => apiPostKey('/api/archive/totrash', key, pageId);
const apiTrash = (key, pageId) => apiPostKey('/api/trash', key, pageId);
const apiTrashRestore = (key, pageId) => apiPostKey('/api/trash/restore', key, pageId);
const apiTrashDelete = (key) => apiPostKey('/api/trash/delete', key);
async function apiArchiveList(){ const r = await fetch('/api/archive'); return r.json(); }
async function apiTrashList(){ const r = await fetch('/api/trash'); return r.json(); }
async function apiRetitle(pageId, oldKey, newTitle){
  const r = await fetch('/api/retitle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pageId, oldKey, newTitle }) });
  return r.json();
}
async function apiHighlight(pageId, field, blockIndex, start, end){
  const r = await fetch('/api/highlight', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pageId, field, blockIndex, start, end }) });
  return r.json();
}

/* ── 제목 롱프레스 → 그 자리에서 바로 편집 ──
   예전엔 롱프레스→메뉴 팝업→입력창 팝업까지 3단계였다(그 전엔 드래그 선택 기반이라
   iOS 콜아웃 메뉴와 겹쳐 더 지저분했다). 메뉴도 팝업도 없이, 제목 텍스트 자리에
   `<input>`을 그대로 겹쳐 편집한다 — 짧은 탭은 원래대로 유튜브 이동(`<a>` 그대로)이라
   메뉴의 "유튜브 링크" 항목도 따로 필요 없다(2026-09-05 사용자 요청). */
let retitleCtx = null;
function setRetitleContext(getCard){ retitleCtx = { getCard }; }
function clearRetitleContext(){ retitleCtx = null; cancelTitleEdit(); }

let titleEditing = false;
function beginTitleEdit(){
  const card = retitleCtx && retitleCtx.getCard(); if (!card) return;
  titleEditing = true;
  const input = $('cardTitleInput');
  input.value = card.front;
  $('cardTitle').hidden = true;
  input.hidden = false;
  input.focus();
  input.select();
}
function cancelTitleEdit(){
  if (!titleEditing) return;
  titleEditing = false;
  $('cardTitleInput').hidden = true;
  $('cardTitle').hidden = false;
}
// 응답을 기다리지 않고 화면부터 바꾼다(markKnown()과 같은 패턴) — Notion PATCH + KV
// 읽기/쓰기가 순차로 쌓여 2초 가까이 걸리는데, 그동안 화면이 안 바뀌어 "안 바뀐 줄"
// 알았다는 게 실기기 피드백이었다. key는 서버가 정하는 정규화 규칙을 그대로 믿어야
// 하므로 응답 오기 전까진 안 건드린다 — 그 사이 "안다" 등을 눌러도 옛 key로 정상 동작.
function commitTitleEdit(){
  if (!titleEditing) return;
  const card = retitleCtx && retitleCtx.getCard();
  const text = $('cardTitleInput').value.trim();
  cancelTitleEdit();
  if (!card || !text || text === card.front) return;
  const oldFront = card.front, oldKey = card.key;
  card.front = text;
  if (!examMode) $('cardTitle').textContent = text;
  else { const el = $('examTitle'); if (el) el.textContent = text; }
  apiRetitle(card.id, oldKey, text).catch(() => null).then((res) => {
    if (res && res.ok){ card.front = res.front; card.key = res.key; toast('제목 변경됨'); return; }
    card.front = oldFront;
    if (!examMode) $('cardTitle').textContent = oldFront;
    else { const el = $('examTitle'); if (el) el.textContent = oldFront; }
    toast('제목 변경 실패');
  });
}
$('cardTitleInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); commitTitleEdit(); }
  else if (e.key === 'Escape'){ e.preventDefault(); cancelTitleEdit(); }
});
$('cardTitleInput').addEventListener('blur', commitTitleEdit);
// 롱프레스 판정 뒤엔 그 손을 떼는 click이 링크 이동으로 이어지지 않게 막는다
// (#cardTitle이 href를 가진 <a>라 평소 짧은 탭은 그대로 유튜브로 이동한다).
let titlePressT = null, titleLongPressed = false;
$('cardTitle').addEventListener('pointerdown', () => {
  titleLongPressed = false;
  titlePressT = setTimeout(() => { titleLongPressed = true; beginTitleEdit(); }, 450);
});
$('cardTitle').addEventListener('pointerup', () => clearTimeout(titlePressT));
$('cardTitle').addEventListener('pointerleave', () => clearTimeout(titlePressT));
$('cardTitle').addEventListener('click', (e) => {
  if (titleLongPressed){ e.preventDefault(); titleLongPressed = false; return; }
  // url 없는 카드는 href가 '#'로 채워져 있어(target=_blank라 탭하면 새 탭이 열리며
  // 앱이 처음부터 부팅돼 소챕터 첫 카드로 떨어지는 버그가 있었다) — url 없으면 그냥
  // 아무 일도 안 하게 막는다(2026-09-05 실기기 피드백).
  const card = retitleCtx && retitleCtx.getCard();
  if (!card || !card.url) e.preventDefault();
});

/* ── 형광펜 모드 ── 켜면 유지되고, 그 뒤 드래그마다 자동으로 그 구간의 code(형광펜)를
   토글한다. 이미 형광펜된 구간을 클릭(드래그 아님)해도 해제된다. 모드를 켜는 순간 이미
   선택돼 있던 텍스트가 있으면 그 자리에서 바로 적용한다(2026-09-05 실기기 피드백 —
   "드래그 후 형광펜 눌러도 반응 없음" 버그 수정). */
// "선택 먼저, 형광펜 나중" 순서가 안 먹히던 이유 — 🖍 버튼은 선택 영역 바깥이라, 버튼을
// 탭하는 순간 iOS가 그 탭 자체로 기존 선택을 먼저 지워버린다(일반적인 모바일 브라우저
// 동작). 그래서 selectionchange로 "마지막으로 있었던 유효한 선택"을 따로 기억해뒀다가,
// 모드를 켜는 시점에 라이브 선택이 비어 있으면 그걸로 되살린다(2026-09-05).
let lastSelRange = null, lastSelAt = 0;
document.addEventListener('selectionchange', () => {
  const sel = document.getSelection();
  if (sel && !sel.isCollapsed && sel.rangeCount){ lastSelRange = sel.getRangeAt(0).cloneRange(); lastSelAt = Date.now(); }
});
let highlightMode = false;
function setHighlightMode(on, btn){
  highlightMode = on;
  $('hlBtn').classList.toggle('active', on);
  $('examHlBtn').classList.toggle('active', on);
  if (on){
    hideTitleMenu(); hideTitleEdit();
    const sel = window.getSelection();
    if (sel.isCollapsed && lastSelRange && Date.now() - lastSelAt < 2000 && document.contains(lastSelRange.startContainer)){
      try { sel.removeAllRanges(); sel.addRange(lastSelRange); } catch (e) {}
    }
    const t = getHighlightTarget();
    if (t){ window.getSelection().removeAllRanges(); doHighlight(t.blk, t.start, t.end); }
  }
}
function toggleHighlightMode(){ setHighlightMode(!highlightMode); }
$('hlBtn').addEventListener('click', toggleHighlightMode);
$('examHlBtn').addEventListener('click', toggleHighlightMode);

function currentCardForHighlight(){
  return !examMode ? studyCards[studyIdx] : examCards[examIdx];
}
function plainOffsetInBlock(blockEl, node, offset){
  const walker = document.createTreeWalker(blockEl, NodeFilter.SHOW_TEXT);
  let pos = 0;
  while (walker.nextNode()){
    if (walker.currentNode === node) return pos + offset;
    pos += walker.currentNode.nodeValue.length;
  }
  return null;
}
function findBlockEl(node){
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el ? el.closest('[data-blk]') : null;
}
function getHighlightTarget(){
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const startBlk = findBlockEl(range.startContainer), endBlk = findBlockEl(range.endContainer);
  if (!startBlk || !endBlk || startBlk !== endBlk) return null;
  const start = plainOffsetInBlock(startBlk, range.startContainer, range.startOffset);
  const end = plainOffsetInBlock(startBlk, range.endContainer, range.endOffset);
  if (start == null || end == null || start >= end) return null;
  return { blk: startBlk.dataset.blk, start, end };
}
// 응답을 기다리지 않고(fire-and-forget) 결과가 오면 그때 반영한다 — Notion PATCH +
// KV 읽기/쓰기가 순차로 쌓여 2초 가까이 걸렸는데, 그 왕복을 기다리는 동안 화면이 그냥
// 멈춰 있던 게 문제였다(2026-09-05 실기기 피드백). 성공 시 시험모드처럼 본문만 다시
// 그린다 — 예전엔 renderStudyCard()를 썼는데, 그 안의 `scroller.scrollTop=0`이 카드
// "이동" 전용 리셋이라 형광펜(카드 안 바뀜)에도 적용돼 화면이 최상단으로 튀었다.
function doHighlight(blk, start, end){
  const card = currentCardForHighlight();
  if (!card) return;
  const field = blk === 'hint' ? 'hint' : 'detail';
  const blockIndex = blk === 'hint' ? null : Number(blk);
  apiHighlight(card.id, field, blockIndex, start, end).catch(() => null).then((res) => {
    if (res && res.ok){
      Object.assign(card, res.card);
      if (!examMode) $('content').innerHTML = cardBodyHtml(card);
      else { const el = $('examBody'); if (el) el.innerHTML = cardBodyHtml(card); }
    } else toast('형광펜 실패');
  });
}
function tryAutoHighlight(){
  if (!highlightMode) return;
  const t = getHighlightTarget();
  if (!t) return;
  const sel = window.getSelection();
  const range = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  sel.removeAllRanges();
  // 낙관적 표시 — 서버 응답 전에 미리 코랄 배경을 씌워둔다. 이미 형광펜된 부분을 다시
  // 칠하는 등 서버 판정과 다를 수 있는 드문 경우엔 실패해도(catch) 그냥 넘어간다 —
  // 응답이 오면 위 doHighlight가 authoritative하게 다시 그려서 어차피 바로잡힌다.
  if (range){
    try {
      const mark = document.createElement('code');
      mark.className = 'hl';
      range.surroundContents(mark);
    } catch (e) {}
  }
  doHighlight(t.blk, t.start, t.end);
}
function onHighlightAreaClick(e){
  if (!highlightMode) return;
  const code = e.target.closest('code.hl');
  if (!code) return;
  const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
  let first = null, last = null;
  while (walker.nextNode()){ if (!first) first = walker.currentNode; last = walker.currentNode; }
  if (!first) return;
  const range = document.createRange();
  range.setStart(first, 0);
  range.setEnd(last, last.nodeValue.length);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  // getHighlightTarget()이 DOM 오프셋을 먼저 읽어야 한다 — outerHTML로 code를 갈아끼우면
  // range가 가리키던 텍스트노드가 그 자리에서 끊겨 이후엔 선택을 못 읽는다.
  const t = getHighlightTarget();
  sel.removeAllRanges();
  if (!t) return;
  code.outerHTML = code.innerHTML; // 낙관적 해제 표시 — 이 경우는 "해제"가 확실하므로 바로 벗긴다
  doHighlight(t.blk, t.start, t.end);
}
// mouseup이 아니라 pointerup — iOS 터치 드래그선택은 합성 mouseup을 안정적으로
// 안 쏴서 형광펜이 아예 안 먹혔다(2026-09-05 실기기 피드백으로 확인된 버그).
document.addEventListener('pointerup', (e) => {
  if (!highlightMode) return;
  if (!e.target.closest('#content, #examBody')) return;
  setTimeout(tryAutoHighlight, 0);
});
document.addEventListener('click', (e) => {
  if (!highlightMode) return;
  if (!e.target.closest('#content, #examBody')) return;
  onHighlightAreaClick(e);
});

/* ── 위치(챕터/소챕터) 상태 — localStorage에 저장해 다음 접속에도 이어본다 ── */
let chapIdx = 0, subIdx = 0;
let totalChapters = 1;
let allChaptersData = null; // /api/chapters 결과 캐시(시트에서 씀)
function loadPos(){
  const p = lsGetJSON('sd_pos', null);
  if (p && typeof p.chap === 'number' && typeof p.sub === 'number'){ chapIdx = p.chap; subIdx = p.sub; }
}
function savePos(){ lsSetJSON('sd_pos', { chap: chapIdx, sub: subIdx }); }
function subId(){ return 'c' + chapIdx + 's' + subIdx; }
function chapId(){ return 'c' + chapIdx; }
let lastShownPos = null;
function flashSubPos(){
  const chip = $('subPosChip');
  chip.classList.remove('flash');
  void chip.offsetWidth; // 리플로우를 강제해야 같은 애니메이션이 다시 재생된다
  chip.classList.add('flash');
  setTimeout(() => chip.classList.remove('flash'), 460);
}
function updateSubPos(){
  const pos = subId();
  if (lastShownPos && lastShownPos !== pos) flashSubPos();
  lastShownPos = pos;
  $('subPos').textContent = (chapIdx + 1) + '-' + (subIdx + 1);
  const known = subchapterAll.filter((c) => c.known).length;
  const total = subchapterAll.length || 1;
  const filled = known / total * 5;
  $('subPosChip').querySelectorAll('.subpos-dots i').forEach((d, i) => {
    d.classList.remove('on', 'half');
    if (filled >= i + 1) d.classList.add('on');
    else if (filled > i) d.classList.add('half');
  });
}

// 소챕터 개수는 카드 총량/10 올림(마지막 소챕터만 짧을 수 있음) — 서버와 동일 규칙(SUB_SIZE=10).
// allChaptersData가 전체 챕터를 들고 있으므로 「지금 챕터」뿐 아니라 이웃 챕터도 바로 계산된다
// — 그래서 챕터를 넘을 때 /api/chapters를 다시 기다릴 필요가 없다(경계 전환의 로딩 제거).
function subCountOf(c){
  const ch = allChaptersData && allChaptersData.chapters && allChaptersData.chapters[c];
  return ch ? Math.max(1, Math.ceil(ch.total / 10)) : 1;
}
// 다음(+1)/이전(-1) 소챕터의 좌표. 챕터 경계와 전체 wrap을 여기 한 곳에서 처리한다.
function neighborPos(dir){
  let c = chapIdx, s = subIdx + dir;
  if (s >= subCountOf(c)){ c = (c + 1) % totalChapters; s = 0; }
  else if (s < 0){ c = (c - 1 + totalChapters) % totalChapters; s = Math.max(0, subCountOf(c) - 1); }
  return { chap: c, sub: s };
}
const posId = (p) => 'c' + p.chap + 's' + p.sub;

async function refreshChapterMeta(){
  const data = await apiChapters().catch(() => null);
  if (data && data.chapters){
    allChaptersData = data;
    totalChapters = data.chapters.length || 1;
  }
}

/* ── 학습(스와이프) — 소챕터 카드 로드/렌더 ── */
let studyCards = [], studyIdx = 0, studyMode = 'all';
let examMode = false;

function showLoading(title, msg, retry){
  $('loadTitle').textContent = title; $('loadMsg').textContent = msg;
  const box = $('loading'); box.hidden = false;
  let btn = box.querySelector('button');
  if (retry){ if (!btn){ btn = document.createElement('button'); box.appendChild(btn); } btn.textContent = '다시 시도'; btn.onclick = retry; }
  else if (btn) btn.remove();
}
function hideLoading(){ $('loading').hidden = true; }

// 소챕터 진입 시 전체 카드를 한 번만 받아온다 — 전체/모르는것만 전환은 이미 있는
// 데이터를 다시 거르기만 하면 되므로 네트워크 왕복이 없다(2026-09-05 실기기 피드백:
// 토글할 때마다 로딩화면이 떠서 깜빡였던 것 — 그 자체를 없앴다).
let subchapterAll = [];

/* ── 인접 소챕터 프리페치 ──
   소챕터를 열면 곧바로 다음·이전 소챕터를 백그라운드로 받아둔다. 이것 하나로 경계 전환의
   세 가지 문제가 같이 풀린다(2026-09-05 라운드6):
     ⓐ 마지막 카드에서 옆으로 미리 보이던 카드가 「같은 소챕터 1번」(고리형 wrap)이라
        손가락을 떼면 다른 카드가 나왔다 → 이제 진짜 다음 카드를 그린다
     ⓑ 경계마다 전체화면 로딩(.loadbox, inset:0)이 떴다 → 데이터가 이미 있어 안 뜬다
     ⓒ peek → 로딩 → 새 카드의 3단 깜빡임 → 스와이프 한 번으로 끝
   캐시 항목은 subchapterAll과 「같은 객체」를 공유한다 — 되돌아왔을 때 "안다"·보관 표시가
   그대로 남아 있어야 하므로 의도된 것. */
const subCache = new Map(), subInflight = new Map();
async function fetchSub(id){
  if (subCache.has(id)) return subCache.get(id);
  if (subInflight.has(id)) return subInflight.get(id); // 진행 중인 프리페치에 편승(중복 요청 방지)
  const p = apiSubchapter(id, 'all')
    .then((data) => {
      if (!data || data.error || !Array.isArray(data.cards)) return null;
      subCache.set(id, data.cards);
      if (subCache.size > 6) subCache.delete(subCache.keys().next().value);
      return data.cards;
    })
    .catch(() => null)
    .finally(() => subInflight.delete(id));
  subInflight.set(id, p);
  return p;
}
function prefetchNeighbors(){
  [neighborPos(1), neighborPos(-1)].forEach((p) => {
    const id = posId(p);
    if (id !== subId()) fetchSub(id);
  });
}

// atEnd — 뒤로 스와이프해서 이전 소챕터로 넘어온 경우엔 첫 카드가 아니라 마지막 카드에
// 도착해야 이동 방향과 화면이 맞는다(2026-09-05 실기기 피드백).
async function loadSubchapter(atEnd){
  if (reviewMode) exitReviewModeUi(); // 실제 챕터로 돌아오는 모든 경로(시트 이동·검색 등)의 공통 관문
  const id = subId();
  let cards = subCache.get(id);
  if (!cards){
    // 캐시가 비었을 때만 로딩을 띄우되, 250ms 안에 끝나면 아예 안 보여준다 — 프리페치가
    // 이미 절반쯤 진행돼 있는 경우가 대부분이라 이 지연 하나로 깜빡임이 사라진다.
    const t = setTimeout(() => showLoading('불러오는 중', '카드를 가져옴'), 250);
    cards = await fetchSub(id);
    clearTimeout(t);
    if (!cards){ showLoading('불러오기 실패', '카드를 못 받음', () => loadSubchapter(atEnd)); return; }
  }
  hideLoading();
  subchapterAll = cards;
  if (!subchapterAll.length){ toast('카드 없음'); return; }
  updateSubPos();
  applyFilter(atEnd);
  prefetchNeighbors();
}
// 이미 받아둔 subchapterAll을 거르기만 한다 — 로딩화면·제목 깜빡임 없이 즉시 반영.
// 보관·휴지통 카드는 전체보기 로테이션에서 항상 빠진다(점수·총량엔 영향 없음 — 순수 가시성).
function visibleCards(list){ return list.filter((c) => !c.archived && !c.trashed); }
function applyFilter(atEnd){
  // 필터 토글(미완료만 ↔ 전체) 전환 시 지금 보던 카드가 새 목록에도 있으면 그 자리를
  // 유지한다 — 예전엔 무조건 0번으로 가서 읽던 위치를 잃었다(2026-09-06 사용자 지적).
  // 소챕터를 새로 불러온 경우(atEnd 호출)는 이전 studyCards가 다른 소챕터 카드라 어차피
  // key가 안 맞아 이 분기를 안 타고 기존 atEnd 규칙 그대로 적용된다.
  const prevKey = studyCards[studyIdx] && studyCards[studyIdx].key;
  const visible = visibleCards(subchapterAll);
  studyCards = studyMode === 'unknown' ? visible.filter((c) => !c.known) : visible;
  if (!studyCards.length){ toast('이 소챕터는 모두 알고 있음 — 전체보기로 전환'); studyMode = 'all'; syncFilterButtons(); studyCards = visible; }
  const keepIdx = prevKey ? studyCards.findIndex((c) => c.key === prevKey) : -1;
  studyIdx = keepIdx >= 0 ? keepIdx : (atEnd ? Math.max(0, studyCards.length - 1) : 0);
  setRetitleContext(() => studyCards[studyIdx]);
  renderStudyCard();
}
function renderStudyCard(){
  const c = studyCards[studyIdx];
  if (!c) return;
  // 스와이프 없이 곧장 점프하는 경로(챕터 목록 이동·검색 결과 이동·복습 카드뷰 진입 등)가
  // 여러 곳으로 늘면서, 드래그 도중 상태가 이 경로들과 겹치면 peek 카드의 잔상 transform이
  // 안 지워진 채 남아 엉뚱한 카드가 화면을 덮는 경우가 있었다(2026-09-06 테스트로 발견) —
  // 매번 여기서 한 번 더 원위치시켜 어느 경로로 와도 항상 깨끗한 상태로 그린다.
  setDragTransition('none'); resetDragX();
  $('cardTitle').textContent = c.front;
  $('cardTitle').href = c.url || '#';
  $('content').innerHTML = cardBodyHtml(c);
  $('scroller').scrollTop = 0;
  renderStudyScrubber();
  // reviewMode에선 known on/off가 "복구 여부"와 무관해 오해를 줄 수 있어 끈다(2026-09-06).
  $('knowBtn').classList.toggle('on', !reviewMode && !!c.known);
  warmImages(studyPrev()); warmImages(studyNext());
  if (reviewMode) updateReviewBar();
}

/* ── "안다" 퀵버튼 — 탭=안다, 롱프레스=보관/휴지통 갈림길(2026-09-05 deep-interview) ──
   보관·휴지통 둘 다 known/총량 점수는 안 건드리는 순수 가시성 플래그라, 로컬에서 바로
   반영하고(subchapterAll도 같이 갱신 — 필터·링 계산이 이걸 보므로) 로테이션에서 뺀다. */
function currentSubEntry(key){ return subchapterAll.find((x) => x.key === key); }
function removeCurrentCardFromRotation(){
  studyCards.splice(studyIdx, 1);
  if (studyIdx >= studyCards.length) studyIdx = Math.max(0, studyCards.length - 1);
  updateSubPos();
  if (!studyCards.length){ toast('이 소챕터에 더 볼 카드 없음 — 다음 소챕터로'); advanceSubchapter(); return; }
  setRetitleContext(() => studyCards[studyIdx]);
  renderStudyCard();
}
async function markKnown(){
  const c = studyCards[studyIdx]; if (!c) return;
  c.known = true;
  const entry = currentSubEntry(c.key); if (entry) entry.known = true;
  $('knowBtn').classList.add('on');
  updateSubPos();
  apiAnswer(subId(), c.key, true, c.id);
  if (studyMode === 'unknown') removeCurrentCardFromRotation();
}
// 2026-09-06 라운드14부터 이 팝업은 트래시 카드뷰 롱프레스("완전삭제" 확인) 하나만 쓴다
// — 평소 보관/휴지통 갈림길은 하단바 상시 버튼(trashQuickBtn/archiveQuickBtn)으로 옮겼다.
function showKnowPop(){ $('knowPop').hidden = false; }
function hideKnowPop(){ $('knowPop').hidden = true; }
document.addEventListener('pointerdown', (e) => {
  if (!$('knowPop').hidden && !e.target.closest('#knowPop') && e.target !== $('knowBtn')) hideKnowPop();
  if (!$('fontPop').hidden && !e.target.closest('#fontPop') && e.target !== $('fontBtn')) hideFontPop();
});
async function doArchive(){
  const c = studyCards[studyIdx]; if (!c) return;
  c.known = true; c.archived = true;
  const entry = currentSubEntry(c.key); if (entry) { entry.known = true; entry.archived = true; }
  await apiArchive(c.key, c.id);
  toast('보관함 — 더 안 보여줌');
  removeCurrentCardFromRotation();
}
async function doTrash(){
  const c = studyCards[studyIdx]; if (!c) return;
  c.trashed = true;
  const entry = currentSubEntry(c.key); if (entry) entry.trashed = true;
  await apiTrash(c.key, c.id);
  toast('휴지통으로 보냄');
  removeCurrentCardFromRotation();
}
$('trashQuickBtn').addEventListener('click', doTrash);
$('archiveQuickBtn').addEventListener('click', doArchive);

let knowPressT = null, knowLongPressed = false;
const knowBtn = $('knowBtn');
// 평소 읽기(reviewMode=null)는 이제 롱프레스 액션이 없다(보관/휴지통이 상시 버튼으로
// 분리됨). 트래시 카드뷰만 롱프레스=완전삭제 확인 팝업, 보관함 카드뷰는 롱프레스=바로
// 휴지통으로 이동(사용자 요청 — 확인 팝업 없이 즉시, 트래시 복구와 대칭되는 위치의
// 되돌리기 어려운 액션은 아니라서 — 휴지통은 다시 복구 가능).
knowBtn.addEventListener('pointerdown', () => {
  knowLongPressed = false;
  if (reviewMode === 'trash'){
    knowPressT = setTimeout(() => { knowLongPressed = true; showKnowPop(); }, 450);
  } else if (reviewMode === 'archive'){
    knowPressT = setTimeout(() => { knowLongPressed = true; doArchiveToTrash(); }, 450);
  }
});
knowBtn.addEventListener('pointerup', () => {
  clearTimeout(knowPressT);
  if (reviewMode){ if (!knowLongPressed) doReviewRestore(); return; }
  markKnown();
});
knowBtn.addEventListener('pointerleave', () => clearTimeout(knowPressT));

/* ── 완전히 앎 / 휴지통 → 챕터처럼 카드뷰로 복습(2026-09-06 라운드13) ──
   지금까지 시트에서 제목만 보이던 목록을 없애고, 헤더를 챕터 행처럼 눌러 바로 스와이프
   복습 화면으로 들어간다(studyCards/렌더/스와이프 엔진을 그대로 재사용 — "오답만 다시
   복습"과 같은 패턴). 하단 바는 필터·전체시험·휴지통/완전히앎 상시버튼이 의미 없어 숨기고,
   안다 버튼은 복구로 바뀐다(휴지통은 롱프레스로 완전삭제, 보관은 롱프레스로 휴지통 이동). */
let reviewMode = null; // null | 'archive' | 'trash'
async function enterReviewMode(kind){
  const path = (kind === 'archive' ? '/api/archive' : '/api/trash') + '?full=1';
  showLoading('불러오는 중', '카드를 가져옴');
  let data;
  try { data = await (await fetch(path)).json(); } catch (e) { data = null; }
  hideLoading();
  if (!data || !Array.isArray(data.items) || !data.items.length){ toast('비어 있음'); return; }
  reviewMode = kind;
  knowLongPressed = false;
  studyCards = data.items; studyIdx = 0;
  $('filterToggle').hidden = true;
  $('subPosDots').hidden = true;
  $('trashQuickBtn').hidden = true;
  $('archiveQuickBtn').hidden = true;
  $('subExamBtn').hidden = true;
  $('bottombar').classList.add('reviewbar');
  knowBtn.classList.add('reviewing');
  setRetitleContext(() => studyCards[studyIdx]);
  renderStudyCard();
}
// 실제 챕터로 돌아가는 모든 경로(시트 이동·검색·뒤로가기)가 거치는 UI 원상복구 —
// loadSubchapter()가 시작할 때 항상 호출해 reviewMode가 새 데이터에 덮여 남지 않게 한다.
function exitReviewModeUi(){
  reviewMode = null;
  $('filterToggle').hidden = false;
  $('subPosDots').hidden = false;
  $('trashQuickBtn').hidden = false;
  $('archiveQuickBtn').hidden = false;
  $('subExamBtn').hidden = false;
  $('bottombar').classList.remove('reviewbar');
  knowBtn.classList.remove('reviewing');
}
function exitReviewMode(){ exitReviewModeUi(); loadSubchapter(); }
function updateReviewBar(){
  $('subPos').textContent = (reviewMode === 'archive' ? '🎓' : '🗑') + ' ' + (studyIdx + 1) + '/' + studyCards.length;
}
// 목록이 다 비면(전부 복구/삭제) 예전엔 곧장 챕터 화면으로 튕겼는데, "코랄버튼 눌러서
// 정리하다 보면 갑자기 챕터로 이동한다"는 지적(2026-09-06)으로 그 자리에 빈 상태만
// 보여주고 나가는 건 상단 칩 탭(exitReviewMode, 이미 있는 경로)에 맡긴다.
function renderReviewEmpty(){
  setDragTransition('none'); resetDragX();
  $('cardTitle').textContent = '';
  $('content').innerHTML = '<p style="text-align:center;color:var(--muted);padding:60px 20px;font-size:14px">'
    + (reviewMode === 'archive' ? '완전히 앎 — 비어 있음' : '휴지통 — 비어 있음') + '</p>';
  $('subPos').textContent = (reviewMode === 'archive' ? '🎓' : '🗑') + ' 0/0';
  renderStudyScrubber();
}
function removeCurrentReviewCard(){
  studyCards.splice(studyIdx, 1);
  if (studyIdx >= studyCards.length) studyIdx = Math.max(0, studyCards.length - 1);
  if (!studyCards.length){ renderReviewEmpty(); return; }
  setRetitleContext(() => studyCards[studyIdx]);
  renderStudyCard();
}
async function doReviewRestore(){
  const c = studyCards[studyIdx]; if (!c) return;
  if (reviewMode === 'archive') await apiArchiveRestore(c.key, c.id); else await apiTrashRestore(c.key, c.id);
  // 복구 직후 이 소챕터를 다시 열면 캐시(subCache)에 archived/trashed:true가 남아있어
  // 안 보이던 문제(2026-09-06 라운드12)와 같은 이유로 여기서도 지운다.
  subCache.clear();
  toast('복구함');
  removeCurrentReviewCard();
}
async function doArchiveToTrash(){
  const c = studyCards[studyIdx]; if (!c) return;
  await apiArchiveToTrash(c.key, c.id);
  subCache.clear();
  toast('휴지통으로 보냄');
  removeCurrentReviewCard();
}
$('reviewDeleteBtn').addEventListener('click', async () => {
  const c = studyCards[studyIdx]; if (!c) return;
  hideKnowPop();
  await apiTrashDelete(c.key);
  toast('완전삭제됨');
  removeCurrentReviewCard();
});
function renderStudyScrubber(){
  const n = studyCards.length;
  const track = $('scrubTrack');
  let dots = track.querySelectorAll('.dot');
  while (dots.length < n){ const d = document.createElement('div'); d.className = 'dot'; track.appendChild(d); dots = track.querySelectorAll('.dot'); }
  while (dots.length > n){ dots[dots.length - 1].remove(); dots = track.querySelectorAll('.dot'); }
  dots.forEach((d, i) => { d.style.left = (n > 1 ? (i / (n - 1)) * 100 : 0) + '%'; d.classList.toggle('cur', i === studyIdx); });
}
function scrubIndexFromX(clientX){
  const rect = $('scrubTrack').getBoundingClientRect();
  const n = studyCards.length;
  if (n < 2) return 0;
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  return Math.round(ratio * (n - 1));
}
let scrubbing = false;
$('scrubber').addEventListener('pointerdown', (e) => {
  if (studyCards.length < 2) return;
  scrubbing = true;
  try { $('scrubber').setPointerCapture(e.pointerId); } catch (err) {}
  studyIdx = scrubIndexFromX(e.clientX); renderStudyCard();
});
$('scrubber').addEventListener('pointermove', (e) => {
  if (!scrubbing) return;
  const i = scrubIndexFromX(e.clientX);
  if (i !== studyIdx){ studyIdx = i; renderStudyCard(); }
});
$('scrubber').addEventListener('pointerup', () => { scrubbing = false; });
$('scrubber').addEventListener('pointercancel', () => { scrubbing = false; });

   베이크오프 라운드4: 전체/미완료 2버튼 세그먼트가 결국 이진 선택이라 토글 하나로 단순화. */

/* 소챕터/챕터 경계 — 자동으로 다음 소챕터, 챕터가 끝나면 전체시험 넛지 */
// ⚠ 여기서 /api/chapters를 기다리지 않는다 — allChaptersData가 이미 전체 챕터를 들고 있어
// 이웃 좌표는 즉시 계산되고(subCountOf), 점수 갱신은 뒤에서 따라오면 된다. 예전엔 챕터를
// 넘을 때마다 이 왕복이 로딩 화면을 한 번 더 만들었다.
async function advanceSubchapter(){
  const finishedChap = chapIdx, p = neighborPos(1), crossed = p.chap !== chapIdx;
  chapIdx = p.chap; subIdx = p.sub;
  savePos();
  await loadSubchapter();
  if (crossed) showChapNudge(finishedChap);
  else toast('소챕터 ' + (subIdx + 1) + '로 이동');
  refreshChapterMeta();
}
async function retreatSubchapter(){
  const p = neighborPos(-1);
  chapIdx = p.chap; subIdx = p.sub;
  savePos();
  await loadSubchapter(true);
  refreshChapterMeta();
}
function showChapNudge(finishedChapIdx){
  $('chapNudgeText').textContent = '챕터 ' + (finishedChapIdx + 1) + ' 다 봤음 — 전체 시험 볼까요?';
  $('chapNudge').classList.add('on');
  $('chapNudge').dataset.chap = finishedChapIdx;
}
function hideChapNudge(){ $('chapNudge').classList.remove('on'); }
$('chapNudgeSkip').addEventListener('click', hideChapNudge);
$('chapNudgeGo').addEventListener('click', () => {
  const ci = Number($('chapNudge').dataset.chap);
  hideChapNudge();
  enterChapterExam('c' + ci);
});

/* ── 좌우 스와이프=소챕터 안 이전/다음(경계에서 자동 다음 소챕터), 상하=스크롤.
   긴 누르기(길게 눌러 안 움직이면)는 텍스트 선택으로 넘긴다 — 스와이프 트래킹 자체를
   시작하지 않아서 iOS 네이티브 선택이 방해받지 않는다(2026-09-05 실기기 피드백:
   "드래그하려 하면 스와이프가 됨" 수정). 짧게 스치면 그대로 스와이프. ── */
const content = $('content'), scroller = $('scroller'), cardTitleEl = $('cardTitle');
const peekPrev = $('peekPrev'), peekNext = $('peekNext');
const COMMIT_RATIO = 0.5, FLICK_MS = 300, FLICK_RATIO = 0.18, TRANSITION_MS = 280, DRAG_SENS = 1.15;
const SELECT_PRIME_MS = 450, MOVE_TOL = 10;
let sx = 0, sy = 0, dx = 0, dy = 0, mode = null, dragging = false, dragW = 1, startT = 0;
let pressTimer = null, selectPrimed = false;

// 소챕터 안에서는 그냥 옆 카드, 경계에서는 「실제로 도착할」 이웃 소챕터의 카드를 보여준다.
// 예전엔 % 로 고리를 돌아 같은 소챕터 카드를 그렸고, 그래서 손가락을 떼면 화면이 바뀌었다.
// 프리페치가 아직 안 끝났으면 null → peek이 비어 보이지만, 틀린 카드를 보여주는 것보다 낫다.
function boundaryCard(dir){
  const cards = subCache.get(posId(neighborPos(dir)));
  if (!cards) return null;
  const vis = visibleCards(cards);
  let list = vis;
  if (studyMode === 'unknown'){
    const unknown = vis.filter((c) => !c.known);
    list = unknown.length ? unknown : vis; // applyFilter의 "전부 알고 있으면 전체보기" 폴백과 같은 규칙
  }
  if (!list.length) return null;
  return dir > 0 ? list[0] : list[list.length - 1];
}
// reviewMode(완전히 앎/휴지통 카드뷰)에서는 경계 밖이 chapIdx/subIdx와 무관한 별도
// 풀이라 boundaryCard(실제 챕터 기준)를 부르면 안 맞는 카드가 나온다 — 그냥 없음으로 둔다.
function studyPrev(){ return studyIdx > 0 ? studyCards[studyIdx - 1] : (reviewMode ? null : boundaryCard(-1)); }
function studyNext(){ return studyIdx + 1 < studyCards.length ? studyCards[studyIdx + 1] : (reviewMode ? null : boundaryCard(1)); }
function setDragX(px){
  content.style.transform = 'translateX(' + px + 'px)'; cardTitleEl.style.transform = 'translateX(' + px + 'px)';
  peekPrev.style.transform = 'translateX(calc(-100% + ' + px + 'px))'; peekNext.style.transform = 'translateX(calc(100% + ' + px + 'px))';
}
function resetDragX(){ content.style.transform = ''; cardTitleEl.style.transform = ''; peekPrev.style.transform = ''; peekNext.style.transform = ''; }
function setDragTransition(t){ content.style.transition = t; cardTitleEl.style.transition = t; peekPrev.style.transition = t; peekNext.style.transition = t; }
function dragCurve(rawDx, w){
  const amp = rawDx * DRAG_SENS, sign = amp < 0 ? -1 : 1, abs = Math.abs(amp);
  return abs <= w ? amp : sign * (w + (abs - w) * 0.3);
}
function beginSwipeTracking(e){
  dragging = true; mode = null;
  dragW = scroller.offsetWidth || 1;
  try { scroller.setPointerCapture(e.pointerId); } catch (err) {}
  setDragTransition('none');
  const pc = studyPrev(), nc = studyNext();
  $('peekPrevTitle').textContent = pc ? pc.front : ''; $('peekPrevBody').innerHTML = peekBodyHtml(pc);
  $('peekNextTitle').textContent = nc ? nc.front : ''; $('peekNextBody').innerHTML = peekBodyHtml(nc);
}
scroller.addEventListener('pointerdown', (e) => {
  if (studyCards.length < 2 || examMode || highlightMode || titleEditing) return;
  // 이미 선택된 텍스트가 있으면(선택 핸들을 드래그하는 중) 스와이프 트래킹 자체를
  // 시작하지 않는다 — 여기서 캡처를 걸면 핸들 드래그가 그 자리에서 끊긴다.
  if (!window.getSelection().isCollapsed) return;
  dragging = false; selectPrimed = false; mode = null;
  sx = e.clientX; sy = e.clientY; dx = 0; dy = 0; startT = e.timeStamp;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { selectPrimed = true; }, SELECT_PRIME_MS);
});
// 형광펜 모드에선 스와이프 트래킹을 아예 시작하지 않는다 — 선택 시작뿐 아니라
// 핸들로 정교하게 조정하는 단계까지 통째로 네이티브에 맡겨야 안전해서, "가로우세
// 판정"류 휴리스틱보다 이쪽이 확실하다(2026-09-05 실기기 피드백).
scroller.addEventListener('pointermove', (e) => {
  if (studyCards.length < 2 || examMode || highlightMode || titleEditing) return;
  const mdx = e.clientX - sx, mdy = e.clientY - sy;
  if (!dragging && !selectPrimed){
    // 가로 이동이 세로보다 뚜렷할 때만 스와이프로 캡처한다 — 길게 누르는 동안의 세로
    // 흔들림까지 캡처를 걸어버려 네이티브 텍스트 선택을 막던 문제(2026-09-05 실기기
    // 피드백)를 여기서 막는다. 세로 쪽은 그냥 return — 네이티브 스크롤에 맡긴다.
    if (Math.abs(mdx) > MOVE_TOL && Math.abs(mdx) > Math.abs(mdy)){
      clearTimeout(pressTimer);
      beginSwipeTracking(e);
    } else return;
  }
  if (selectPrimed) return; // 네이티브 선택에 맡긴다 — 우리는 아무것도 안 함
  if (!dragging) return;
  dx = mdx; dy = mdy;
  if (mode === null && (Math.abs(dx) > MOVE_TOL || Math.abs(dy) > MOVE_TOL)) mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (mode === 'h') setDragX(dragCurve(dx, dragW));
});
scroller.addEventListener('pointerup', (e) => {
  clearTimeout(pressTimer);
  if (selectPrimed){ selectPrimed = false; return; }
  if (!dragging) return;
  dragging = false;
  if (mode === 'h'){
    const elapsed = e.timeStamp - startT, ratio = Math.abs(dx) / dragW;
    const isFlick = elapsed <= FLICK_MS && ratio >= FLICK_RATIO;
    const commit = isFlick || ratio >= COMMIT_RATIO;
    setDragTransition('transform ' + TRANSITION_MS + 'ms cubic-bezier(.2,.7,.3,1)');
    if (commit && dx < 0){
      setDragX(-dragW);
      content.addEventListener('transitionend', function onEnd(){
        content.removeEventListener('transitionend', onEnd); setDragTransition('none'); resetDragX();
        // reviewMode에선 소챕터 경계가 없다 — 마지막 카드에서 그냥 멈춘다(advanceSubchapter는
        // chapIdx/subIdx 기준 실제 챕터로 튀어버려 복습 풀을 이탈시킨다).
        if (studyIdx + 1 >= studyCards.length) { if (reviewMode) toast('마지막 카드'); else advanceSubchapter(); }
        else { studyIdx++; renderStudyCard(); }
      }, { once: true });
    } else if (commit && dx > 0){
      setDragX(dragW);
      content.addEventListener('transitionend', function onEnd(){
        content.removeEventListener('transitionend', onEnd); setDragTransition('none'); resetDragX();
        if (studyIdx - 1 < 0) { if (reviewMode) toast('첫 카드'); else retreatSubchapter(); }
        else { studyIdx--; renderStudyCard(); }
      }, { once: true });
    } else resetDragX();
  }
  mode = null;
});
scroller.addEventListener('pointercancel', () => { clearTimeout(pressTimer); dragging = false; selectPrimed = false; mode = null; resetDragX(); });

/* ── 최상단 풀다운 시 하단바까지 딸려 내려가던 증상 — CSS(html,body 잠금)로는 실기기에서
   재현이 계속돼(2026-09-05), touchmove를 직접 가로채는 더 확실한 방식으로 바꿨다.
   .scroller가 이미 맨 위(scrollTop 0)인 상태에서 아래로 당기는 제스처만 막는다 —
   그 외(스크롤 중·위로 당김·가로 스와이프)는 그대로 둔다. 라이트박스·시트·시험모드는
   각자 자기 제스처가 있어 건드리지 않는다. */
let pullStartY = null;
$('app').addEventListener('touchstart', (e) => {
  pullStartY = e.touches[0] ? e.touches[0].clientY : null;
}, { passive: true });
$('app').addEventListener('touchmove', (e) => {
  if (pullStartY == null || examMode) return;
  if (!$('lightbox').hidden) return;
  if ($('sheet').classList.contains('on')) return;
  if (!$('fontPop').hidden) return;
  const t = e.touches[0]; if (!t) return;
  if (scroller.scrollTop <= 0 && t.clientY - pullStartY > 0) e.preventDefault();
}, { passive: false });

/* ── 시험(소챕터/챕터 공용) ──
   제목만 → "정답 확인" 탭 → 본문 리빌 → "알고 있었음/몰랐음" 최종 확정(되돌리기 없음).
   순서는 매번 섞는다. 5/10, 80/100 통과 기준은 게이트가 아니라 최고기록 현황판일 뿐. */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let examScope = 'sub', examCards = [], examIdx = 0, examResults = {}, examLastSub = null, examLastChap = null;

function enterExamMode(){ examMode = true; $('readRoot').hidden = true; $('examView').hidden = false; }
function exitExamMode(){ examMode = false; $('examView').hidden = true; $('readRoot').hidden = false; clearRetitleContext(); setRetitleContext(() => studyCards[studyIdx]); }
$('examBack').addEventListener('click', exitExamMode);

// 2026-09-06 라운드14: "1-1" 칩 탭이 시험에서 "이 소챕터 카드 목록"으로 바뀌었다 —
// 시험은 좌상단 전용 아이콘(subExamBtn)으로 옮김.
$('subPosChip').addEventListener('click', () => { if (reviewMode) exitReviewMode(); else openSubchapterList(); });
$('subExamBtn').addEventListener('click', () => { if (!reviewMode) enterSubchapterExam(); });
async function enterSubchapterExam(){
  // 이미 받아둔 subchapterAll을 그대로 쓴다 — 보관·휴지통 카드는 시험 문제 풀에서도 뺀다.
  const pool = visibleCards(subchapterAll);
  if (!pool.length){ toast('시험 볼 카드 없음(전부 보관/휴지통)'); return; }
  examScope = 'sub';
  examCards = shuffle(pool.map((c) => ({ ...c, subId: subId() })));
  startExam('소챕터 ' + (chapIdx + 1) + '-' + (subIdx + 1) + ' 시험');
}
async function enterChapterExam(cId){
  showLoading('불러오는 중', '챕터 전체 문제를 가져옴');
  let data;
  try { data = await apiChapterExam(cId); }
  catch (e) { showLoading('불러오기 실패', String(e.message || e)); return; }
  hideLoading();
  if (data.error || !data.cards.length){ toast(data.error || '카드 없음'); return; }
  const pool = visibleCards(data.cards);
  if (!pool.length){ toast('시험 볼 카드 없음(전부 보관/휴지통)'); return; }
  examScope = 'chap';
  examCards = shuffle(pool);
  startExam('챕터 ' + (Number(cId.slice(1)) + 1) + ' 전체시험');
}
function startExam(title){
  examIdx = 0; examResults = {}; examLastSub = null; examLastChap = null;
  $('examTitleBar').textContent = title;
  enterExamMode();
  setRetitleContext(() => examCards[examIdx]);
  renderExamCard();
  $('examJudge').onclick = (e) => { const b = e.target.closest('button'); if (b) judgeCard(b.dataset.k === '1'); };
}
function renderExamCard(){
  if (examIdx >= examCards.length){ renderExamResult(); return; }
  $('examProg').textContent = (examIdx + 1) + ' / ' + examCards.length;
  const c = examCards[examIdx];
  $('examCard').innerHTML = '<div class="examtitle" id="examTitle">' + esc(c.front) + '</div>'
    + '<button class="examreveal" id="examReveal">정답 확인</button>';
  $('examJudge').hidden = true;
  $('examReveal').addEventListener('click', () => {
    $('examCard').innerHTML = '<div class="examtitle" id="examTitle">' + esc(c.front) + '</div>'
      + '<div class="content exambody" id="examBody">' + cardBodyHtml(c) + '</div>';
    $('examJudge').hidden = false;
  }, { once: true });
}

/* ── 이미지 확대(라이트박스) ──
   초창기 수동 메모는 스크린샷을 붙여넣은 카드가 있어 본문 폭에 맞추면 글씨가 안 읽힌다.
   페이지 자체는 maximum-scale=1이라 브라우저 핀치줌이 막혀 있으므로 여기서 transform으로
   직접 확대한다. Notion 자체 호스팅 이미지는 src가 /api/image?id= 리다이렉트라, 본문에
   쓰인 src 문자열을 그대로 재사용하면 된다(별도 캐시를 만들지 말 것 — 1시간 만료). */
const lb = $('lightbox'), lbImg = $('lbImg');
const LB_MAX = 6, LB_TAP_MS = 300, LB_TAP_TOL = 8;
// 스와이프 다운 닫기 — 우상단 ✕만으로는 엄지가 피로하다(2026-09-05 실기기 피드백).
// 아래 방향만 받는다: 위아래를 다 받으면 확대하려다 잘못 튕겼을 때 닫히는 오작동이 는다.
const LB_DISMISS_PX = 90, LB_DISMISS_FLICK_MS = 300, LB_DISMISS_FLICK_PX = 40, LB_DISMISS_SPAN = 260;
let lbScale = 1, lbTx = 0, lbTy = 0, lbBase = null, lbStart = null, lbLastTap = 0;
const lbPointers = new Map();

function lbApply(){ lbImg.style.transform = 'translate(' + lbTx + 'px,' + lbTy + 'px) scale(' + lbScale + ')'; }
// 확대된 이미지가 화면 밖으로 빠져나가지 않도록 이동량을 가둔다(화면보다 작으면 중앙 고정).
function lbClamp(){
  if (!lbBase) return;
  const mx = Math.max(0, (lbBase.w * lbScale - window.innerWidth) / 2);
  const my = Math.max(0, (lbBase.h * lbScale - window.innerHeight) / 2);
  lbTx = Math.min(mx, Math.max(-mx, lbTx));
  lbTy = Math.min(my, Math.max(-my, lbTy));
}
// 화면 좌표 (px,py)를 제자리에 둔 채 배율만 s로 바꾼다.
// 화면위치 = 중심 + t + q*scale 이므로, 같은 q를 유지하려면 t' = d - (d - t) * s/scale (d = p - 중심).
function lbZoomAround(s, px, py, fromScale, fromTx, fromTy){
  const next = Math.min(LB_MAX, Math.max(1, s));
  const dx = px - lbBase.cx, dy = py - lbBase.cy;
  lbTx = dx - (dx - fromTx) * (next / fromScale);
  lbTy = dy - (dy - fromTy) * (next / fromScale);
  lbScale = next;
  lbClamp(); lbApply();
}
function lbMeasure(){
  const r = lbImg.getBoundingClientRect();
  lbBase = { w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
}
function openLightbox(src){
  lbScale = 1; lbTx = 0; lbTy = 0; lbStart = null; lbLastTap = 0; lbPointers.clear();
  lbImg.style.transform = '';
  lbImg.src = src;
  lb.hidden = false;
  // 배율 계산의 기준(렌더 크기·중심)은 transform이 없는 상태에서 재야 한다.
  if (lbImg.complete && lbImg.naturalWidth) lbMeasure();
  else lbImg.addEventListener('load', lbMeasure, { once: true });
}
// 끌어내리는 동안 이미지가 손가락을 따라가고 배경·컨트롤이 함께 옅어진다 — 얼마나 더 끌면
// 닫히는지 손에 보여주는 피드백. 배경은 CSS의 불투명 #000을 인라인 rgba로 잠깐 덮는다.
function lbSetDismissProgress(dy){
  const p = Math.min(1, Math.max(0, dy / LB_DISMISS_SPAN));
  lbImg.style.transform = 'translate(' + lbTx + 'px,' + (lbTy + dy) + 'px) scale(' + (lbScale * (1 - p * 0.14)) + ')';
  lb.style.backgroundColor = 'rgba(0,0,0,' + (1 - p * 0.82) + ')';
  const o = String(1 - p);
  $('lbClose').style.opacity = o;
  const hint = lb.querySelector('.lbhint'); if (hint) hint.style.opacity = o;
}
function lbClearDismissStyles(){
  lb.style.backgroundColor = ''; lb.style.transition = '';
  lbImg.style.transition = '';
  $('lbClose').style.opacity = '';
  const hint = lb.querySelector('.lbhint'); if (hint) hint.style.opacity = '';
}
function lbCancelDismiss(){ // 임계에 못 미쳤을 때 제자리로
  lbImg.style.transition = 'transform .22s cubic-bezier(.2,.7,.3,1)';
  lb.style.transition = 'background-color .22s ease';
  lb.style.backgroundColor = '';
  $('lbClose').style.opacity = '';
  const hint = lb.querySelector('.lbhint'); if (hint) hint.style.opacity = '';
  lbApply();
  setTimeout(lbClearDismissStyles, 240);
}
function lbCommitDismiss(dy){
  lbImg.style.transition = 'transform .2s ease-out';
  lb.style.transition = 'background-color .2s ease';
  lbSetDismissProgress(Math.max(dy, window.innerHeight * 0.55)); // 화면 밖으로 밀어내며 페이드
  setTimeout(closeLightbox, 200);
}
function closeLightbox(){ lb.hidden = true; lbImg.src = ''; lbPointers.clear(); lbStart = null; lbClearDismissStyles(); }
$('lbClose').addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });
window.addEventListener('resize', () => { if (!lb.hidden){ lbScale = 1; lbTx = 0; lbTy = 0; lbApply(); lbMeasure(); } });

lb.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.lbclose')) return;
  lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { lb.setPointerCapture(e.pointerId); } catch (err) {}
  if (lbPointers.size === 1){
    lbStart = { x: e.clientX, y: e.clientY, tx: lbTx, ty: lbTy, moved: false, t: e.timeStamp };
  } else if (lbPointers.size === 2){
    const p = [...lbPointers.values()];
    lbStart = { pinch: true, scale: lbScale, tx: lbTx, ty: lbTy,
      dist: Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)),
      cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2 };
  }
});
lb.addEventListener('pointermove', (e) => {
  if (!lbPointers.has(e.pointerId) || !lbStart || !lbBase) return;
  lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (lbStart.pinch && lbPointers.size >= 2){
    const p = [...lbPointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    // 누적 오차를 피하려고 매 프레임 "제스처 시작값"에서 다시 계산한다.
    lbZoomAround(lbStart.scale * (d / lbStart.dist), lbStart.cx, lbStart.cy, lbStart.scale, lbStart.tx, lbStart.ty);
  } else if (!lbStart.pinch){
    const mdx = e.clientX - lbStart.x, mdy = e.clientY - lbStart.y;
    if (Math.abs(mdx) > LB_TAP_TOL || Math.abs(mdy) > LB_TAP_TOL) lbStart.moved = true;
    // 확대 상태면 팬이 우선 — 확대해 놓고 보다가 실수로 닫히면 곤란하다.
    if (lbScale > 1.02){ lbTx = lbStart.tx + mdx; lbTy = lbStart.ty + mdy; lbClamp(); lbApply(); return; }
    // 기본 배율에서 아래로 끌면 닫기 제스처(위·가로 방향은 무시)
    if (!lbStart.dismiss && mdy > LB_TAP_TOL && mdy > Math.abs(mdx)) lbStart.dismiss = true;
    if (lbStart.dismiss) lbSetDismissProgress(Math.max(0, mdy));
  }
});
function lbEndPointer(e){
  lbPointers.delete(e.pointerId);
  if (lbPointers.size > 0){ lbStart = null; return; } // 핀치 중 한 손가락만 뗀 상태
  const s = lbStart; lbStart = null;
  if (!s) return;
  if (s.dismiss){ // 천천히 90px 이상 끌었거나, 짧게 튕겼으면 닫는다
    const dy = Math.max(0, e.clientY - s.y), elapsed = e.timeStamp - s.t;
    const flick = elapsed <= LB_DISMISS_FLICK_MS && dy >= LB_DISMISS_FLICK_PX;
    if (dy >= LB_DISMISS_PX || flick) lbCommitDismiss(dy);
    else lbCancelDismiss();
    return;
  }
  if (s.pinch || s.moved) return;
  const now = e.timeStamp;
  if (now - lbLastTap < LB_TAP_MS){ // 더블탭 = 2.5배 ↔ 원래 크기 토글
    lbLastTap = 0;
    lbZoomAround(lbScale > 1.02 ? 1 : 2.5, e.clientX, e.clientY, lbScale, lbTx, lbTy);
    return;
  }
  lbLastTap = now;
  // 단일 탭은 확대 상태가 아닐 때만 닫기 — 확대해 놓고 화면을 짚었을 때 꺼지면 곤란하다.
  setTimeout(() => { if (lbLastTap === now && lbScale <= 1.02 && !lb.hidden) closeLightbox(); }, LB_TAP_MS + 20);
}
lb.addEventListener('pointerup', lbEndPointer);
lb.addEventListener('pointercancel', (e) => {
  lbPointers.delete(e.pointerId);
  const s = lbStart; lbStart = null;
  if (s && s.dismiss) lbCancelDismiss();
});
