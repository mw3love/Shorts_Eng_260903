const SEARCH_BADGE = { unknown: '미확인', known: '확인함', archive: '완전히 앎', trash: '휴지통' };
// 검색·소챕터목록·챕터목록 셋 다 "제목+상태배지 목록 → 탭해서 이동" 모양이 같아 공유한다.
function renderPickList(el, items, emptyMsg, onPick, showIndex){
  if (!items.length){ el.innerHTML = '<div style="padding:16px 4px;color:var(--muted);font-size:12.5px;text-align:center">' + emptyMsg + '</div>'; return; }
  el.innerHTML = items.map((it, i) => '<div class="trashrow" data-i="' + i + '">'
    + (showIndex ? '<span class="tn">' + (i + 1) + '</span>' : '')
    + '<span class="tf">' + esc(it.front) + '</span>'
    + '<div class="ta"><span class="searchbadge s-' + it.status + '">' + SEARCH_BADGE[it.status] + '</span></div>'
    + '</div>').join('');
  el.querySelectorAll('.trashrow').forEach((row) => row.addEventListener('click', () => onPick(items[Number(row.dataset.i)])));
}
function renderSearchResults(items){ renderPickList($('searchResults'), items, '결과 없음', (it) => { closeSearch(); navigateToCard(it); }); }
// key로 직접 찾아 위치를 맞춘다 — 로테이션·필터 상태와 무관하게 항상 정확한 카드에 도착.
function navigateToCard(it){
  if (it.status === 'archive' || it.status === 'trash'){
    enterReviewMode(it.status).then(() => {
      const i = studyCards.findIndex((c) => c.key === it.key);
      if (i >= 0){ studyIdx = i; renderStudyCard(); }
    });
    return;
  }
  const p = parseSubIdClient(it.subId);
  chapIdx = p.chap; subIdx = p.sub; savePos();
  loadSubchapter().then(() => {
    const i = studyCards.findIndex((c) => c.key === it.key);
    if (i >= 0){ studyIdx = i; setRetitleContext(() => studyCards[studyIdx]); renderStudyCard(); updateSubPos(); }
    refreshChapterMeta();
  });
}
let searchT = null;
function openSearch(){ $('searchOv').hidden = false; $('searchInput').value = ''; $('searchResults').innerHTML = ''; setTimeout(() => $('searchInput').focus(), 60); }
function closeSearch(){ $('searchOv').hidden = true; clearTimeout(searchT); }
$('searchOpenBtn').addEventListener('click', openSearch);
$('searchCloseBtn').addEventListener('click', closeSearch);

/* ── 소챕터/챕터 "카드 제목 목록" (2026-09-06 라운드14) ──
   상단 "1-1" 칩 탭 = 이 소챕터(10장) 목록, 챕터 시트의 챕터 행 탭 = 그 챕터(100장) 목록.
   검색 오버레이와 뼈대(renderPickList/navigateToCard)를 공유 — 탭하면 같은 방식으로 이동. */
function cardStatus(c){ return c.archived ? 'archive' : c.trashed ? 'trash' : c.known ? 'known' : 'unknown'; }
function openListOv(title){ $('listOvTitle').textContent = title; $('listOv').hidden = false; }
function closeListOv(){ $('listOv').hidden = true; }
$('listCloseBtn').addEventListener('click', closeListOv);
function openSubchapterList(){
  const items = subchapterAll.map((c) => ({ key: c.key, front: c.front, subId: subId(), status: cardStatus(c) }));
  openListOv((chapIdx + 1) + '-' + (subIdx + 1) + ' 목록');
  renderPickList($('listResults'), items, '카드 없음', (it) => { closeListOv(); navigateToCard(it); }, true);
}
async function openChapterList(cId){
  showLoading('불러오는 중', '챕터 목록을 가져옴');
  let data;
  try { data = await apiChapterExam(cId); } catch (e) { hideLoading(); toast('불러오기 실패'); return; }
  hideLoading();
  if (data.error || !data.cards.length){ toast(data.error || '카드 없음'); return; }
  const items = data.cards.map((c) => ({ key: c.key, front: c.front, subId: c.subId, status: cardStatus(c) }));
  openListOv('챕터 ' + (Number(cId.slice(1)) + 1) + ' 목록');
  renderPickList($('listResults'), items, '카드 없음', (it) => { closeListOv(); navigateToCard(it); }, true);
}
$('searchInput').addEventListener('input', () => {
  clearTimeout(searchT);
  const q = $('searchInput').value.trim();
  if (!q){ $('searchResults').innerHTML = ''; return; }
  searchT = setTimeout(async () => {
    const data = await fetch('/api/search?q=' + encodeURIComponent(q)).then((r) => r.json()).catch(() => null);
    renderSearchResults((data && data.items) || []);
  }, 220);
});

/* ── 시작 ── */
(async () => {
  applyTitleScale(); applyBodyScale();
  loadPos();
  showLoading('불러오는 중', '챕터 정보를 가져옴');
  await refreshChapterMeta();
  if (!allChaptersData || !allChaptersData.chapters || !allChaptersData.chapters.length){
    showLoading('동기화 중', 'Notion에서 카드를 가져오는 중 — 잠시 후 다시 시도', async () => { await refreshChapterMeta(); loadSubchapter(); });
    return;
  }
  if (chapIdx >= totalChapters) chapIdx = 0;
  await loadSubchapter();
})();
</script>
