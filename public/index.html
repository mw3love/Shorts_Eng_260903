<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D10">
<title>Shorts Deck</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0B0D10; --ink2:#151A20; --ink3:#1E252D; --ink4:#262E38;
    --paper:#EFF2F6; --body-text:#C9D1DC; --muted:#8B95A3; --faint:#5A6472;
    --know:#3DD68C; --coral:#FF8F6B;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--know);outline-offset:2px}

  #app{
    position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    max-width:520px;margin:0 auto;background:var(--ink);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-user-select:none;user-select:none;
  }

  /* ── 상단바: 화면 공용(뒤로가기 / 제목 / 설정) ── */
  .topbar2{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none}
  .topbar2 .navbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink3);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;-webkit-touch-callout:none}
  .topbar2 .navbtn[hidden]{display:none}
  .topbar2 .navbtn:active{transform:scale(.94)}
  .topbar2 .navbtn.active{background:color-mix(in srgb,var(--coral) 30%,var(--ink3));color:var(--coral)}
  .topbar2-title{flex:1;font-family:var(--serif);font-size:16px;color:var(--paper);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .views{flex:1;min-height:0;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-user-select:text;user-select:text}
  .view[hidden]{display:none}
  /* 학습/시험 화면은 자체 스크롤 영역(.scroller/.exambody)을 따로 두므로, 바깥 뷰는
     스크롤이 아니라 세로 flex로 스테이지+스크러버+진행표시를 나눠 담는다. */
  #viewStudy, #viewExam{overflow:hidden;display:flex;flex-direction:column}
  #viewStudy[hidden], #viewExam[hidden]{display:none} /* ID 규칙이 .view[hidden]보다 우선하므로 다시 명시 */
  #viewStudy .stage{flex:1;min-height:0;height:auto}

  /* ── 챕터 개요 / 챕터 상세 공용 ── */
  .listwrap{padding:6px 16px 24px;display:flex;flex-direction:column;gap:10px;-webkit-user-select:none;user-select:none}
  .chaphead{padding:4px 16px 10px;display:flex;flex-direction:column;gap:6px}
  .chaphead .num{font-family:var(--mono);font-size:26px;color:var(--paper);font-variant-numeric:tabular-nums}
  .chaphead .num b{color:var(--coral);font-weight:500}
  .chaphead .lbl{font-family:var(--mono);font-size:11px;color:var(--muted)}

  .row{background:var(--ink3);border:0;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;cursor:pointer;-webkit-touch-callout:none}
  .row:active{background:var(--ink4)}
  .row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .row-label{font-family:var(--serif);font-size:15px;color:var(--paper)}
  .row-range{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px}
  .row-score{font-family:var(--mono);font-size:13px;color:var(--paper);font-variant-numeric:tabular-nums;flex:none}
  .row-score .best{color:var(--muted);font-size:10.5px;margin-left:6px}
  .row-bar{height:4px;border-radius:2px;background:var(--ink4);overflow:hidden}
  .row-bar i{display:block;height:100%;background:var(--coral);border-radius:2px}

  .subrow{background:var(--ink3);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
  .subrow-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .subrow-label{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .subrow-score{font-family:var(--mono);font-size:13px;color:var(--paper);font-variant-numeric:tabular-nums}
  .subrow-score .best{color:var(--muted);font-size:10.5px;margin-left:6px}
  .subrow-actions{display:flex;gap:6px}
  .subbtn{flex:1;background:var(--ink4);border:0;border-radius:9px;color:var(--body-text);font-family:var(--sans);font-size:12px;padding:9px 4px;cursor:pointer;-webkit-touch-callout:none}
  .subbtn:active{background:color-mix(in srgb,var(--coral) 25%,var(--ink4))}
  .subbtn.exam{color:var(--coral)}

  .emptymsg{color:var(--muted);font-size:13px;padding:40px 20px;text-align:center}

  /* ── 학습(스와이프) 화면 — 기존 카드 렌더/제스처 재사용 ── */
  .stage{position:relative;height:100%;overflow:hidden}
  .scroller{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-user-select:text;user-select:text}
  .cardtitle{display:block;font-family:var(--serif);font-weight:400;font-size:calc(clamp(22px,6vw,30px) * var(--tscale,1));line-height:1.18;letter-spacing:-.01em;color:var(--paper);text-decoration:none;text-wrap:balance;padding:8px 22px 6px}
  .content{
    padding:6px 60px 40px 20px;min-height:100%;
    font-size:calc(15.5px * var(--bscale,1));line-height:1.66;color:var(--body-text);
    will-change:transform;
  }
  .peek{position:absolute;inset:0;z-index:1;pointer-events:none;will-change:transform;display:flex;flex-direction:column;overflow:hidden}
  .peek-prev{transform:translateX(-100%)}
  .peek-next{transform:translateX(100%)}
  .peek .cardtitle{padding:8px 22px 6px;color:var(--paper)}
  .peekbody{flex:1;min-height:0;-webkit-mask-image:linear-gradient(to bottom, black 55%, transparent 90%);mask-image:linear-gradient(to bottom, black 55%, transparent 90%)}
  .content p{margin:0 0 12px}
  .content h3{font-family:var(--serif);font-weight:400;font-size:1.3em;color:var(--paper);margin:20px 0 8px}
  .content h4{font-family:var(--serif);font-weight:400;font-size:1.15em;color:var(--paper);margin:16px 0 6px}
  .content h5{font-size:1em;margin:12px 0 4px;color:var(--paper);font-weight:600}
  .content ul,.content ol{margin:2px 0 12px;padding-left:20px}
  .content li{margin:3px 0}
  .content blockquote{border-left:2px solid var(--coral);padding-left:12px;margin:6px 0 12px;color:var(--faint);font-style:italic}
  .content .callout{background:var(--ink3);border-radius:10px;padding:10px 12px;margin:4px 0 12px}
  .content hr{border:0;border-top:1px solid var(--ink3);margin:10px 0}
  .content pre{background:var(--ink3);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:4px 0 12px}
  .content pre code{background:none;color:var(--paper);padding:0}
  .content .hl{background:var(--coral);color:var(--ink);padding:.04em .4em;border-radius:4px;font-family:var(--mono);font-size:.88em;font-weight:600;white-space:nowrap}
  .content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.87em}
  .content th,.content td{border:1px solid var(--ink4);padding:6px 8px;text-align:left;vertical-align:top}
  .content th{color:var(--coral);font-weight:500;background:color-mix(in srgb,var(--coral) 7%,transparent)}
  .content .lhint{font-size:1.08em;font-weight:600;color:var(--paper);margin:0 0 14px}
  .content .src{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none;border-bottom:1px solid var(--ink3);padding-bottom:2px;margin-top:4px}

  /* ── 스크러버: 소챕터(최대 10장) 안에서 훑어보기 — 드래그하면 그 카드로 바로 이동 ── */
  .scrubber{flex:none;padding:6px 20px 4px;touch-action:none}
  .scrubtrack{position:relative;height:16px}
  .scrubtrack .track{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--ink3);transform:translateY(-50%);border-radius:2px}
  .scrubtrack .dot{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--faint);transform:translate(-50%,-50%);transition:background-color .1s ease}
  .scrubtrack .dot.cur{background:var(--coral);width:9px;height:9px}
  .studyfoot{flex:none;padding:0 20px 8px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}

  /* ── 시험(exam) ── */
  .examwrap{display:flex;flex-direction:column;height:100%;padding:0 22px}
  .examprog{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);padding:10px 0 0;text-align:center}
  .examcard{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;overflow-y:auto}
  .examtitle{font-family:var(--serif);font-size:clamp(24px,7vw,32px);line-height:1.25;color:var(--paper);text-align:center;text-wrap:balance}
  .examreveal{align-self:center;background:var(--ink3);color:var(--coral);border:0;border-radius:99px;padding:13px 26px;font-family:var(--sans);font-size:14px;cursor:pointer}
  .examreveal:active{background:var(--ink4)}
  /* min-height:0으로 .content{min-height:100%}를 상쇄 — 안 그러면 시험 화면의 justify-content:center
     플렉스가 이 블록을 부모 높이만큼 억지로 늘려서, 위로 넘친 제목이 위쪽으로 잘려 보인다. */
  .exambody{min-height:0;max-height:44vh;overflow-y:auto;-webkit-user-select:text;user-select:text}
  .examjudge{display:flex;gap:10px;padding:6px 0 22px;flex:none}
  .examjudge[hidden]{display:none}
  .examjudge button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-family:var(--sans);font-size:14px;cursor:pointer}
  .examjudge .know{background:color-mix(in srgb,var(--know) 20%,var(--ink3));color:var(--know)}
  .examjudge .dontknow{background:color-mix(in srgb,var(--coral) 16%,var(--ink3));color:var(--coral)}

  .examresult{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:0 24px;text-align:center}
  .examresult .score{font-family:var(--serif);font-size:34px;color:var(--paper)}
  .examresult .best{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .examresult .actions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
  .examresult button{background:var(--ink3);color:var(--paper);border:0;border-radius:10px;padding:13px;font-family:var(--sans);font-size:13.5px;cursor:pointer}
  .examresult button.primary{background:color-mix(in srgb,var(--coral) 20%,var(--ink3));color:var(--coral)}

  /* ── 본문 드래그 선택 → 제목으로 변경 ── */
  .retitlePop{position:fixed;z-index:9;background:var(--coral);color:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:99px;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer;-webkit-user-select:none;user-select:none}
  .retitlePop[hidden]{display:none}

  .toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,8px);z-index:8;font-family:var(--mono);font-size:12.5px;color:var(--paper);background:var(--ink3);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .loadbox{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ink)}
  .loadbox[hidden]{display:none}
  .loadbox h2{font-family:var(--serif);font-weight:300;font-size:22px;margin:0;color:var(--paper)}
  .loadbox p{margin:0;color:var(--muted);font-size:13px}
  .loadbox button{margin-top:6px;background:var(--ink3);color:var(--paper);border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}

  /* ── 설정 시트(글자 크기) ── */
  .sheetback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:6;opacity:0;pointer-events:none;transition:opacity .22s ease}
  .sheetback.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:7;
    background:var(--ink2);border-radius:18px 18px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
    box-shadow:0 -8px 30px rgba(0,0,0,.4);
  }
  .sheet.on{transform:translateY(0)}
  .sheethandle{width:36px;height:4px;background:var(--ink4);border-radius:3px;margin:0 auto 14px}
  .sliderow{display:flex;align-items:center;gap:10px;margin:8px 0}
  .sliderow label{flex:none;width:38px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .sliderow input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;outline:none;background:linear-gradient(to right,var(--coral) 0%,var(--coral) var(--fill,50%),var(--ink4) var(--fill,50%),var(--ink4) 100%)}
  .sliderow input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--coral);cursor:pointer;border:2px solid var(--ink)}
  .sliderow input[type="range"]::-moz-range-track{height:6px;border-radius:999px;background:var(--ink4)}
  .sliderow input[type="range"]::-moz-range-progress{height:6px;border-radius:999px;background:var(--coral)}
  .sliderow input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--coral);border:2px solid var(--ink);cursor:pointer}
  .sliderow .val{flex:none;width:38px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar2" id="topbar2">
    <button class="navbtn" id="backBtn" hidden aria-label="뒤로">&#8592;</button>
    <div class="topbar2-title" id="topbarTitle">Shorts Deck</div>
    <button class="navbtn" id="hlBtn" hidden aria-label="형광펜 모드">&#128397;</button>
    <button class="navbtn" id="gearBtn" aria-label="설정">&#9881;</button>
  </div>

  <div class="views" id="views">
    <section class="view" id="viewChapters"></section>
    <section class="view" id="viewChapter" hidden></section>

    <section class="view" id="viewStudy" hidden>
      <div class="stage" id="studyStage">
        <div class="scroller" id="scroller">
          <a class="cardtitle" id="cardTitle" href="#" target="_blank" rel="noopener"></a>
          <div class="content" id="content"></div>
        </div>
        <div class="peek peek-prev" id="peekPrev"><div class="cardtitle" id="peekPrevTitle"></div><div class="content peekbody" id="peekPrevBody"></div></div>
        <div class="peek peek-next" id="peekNext"><div class="cardtitle" id="peekNextTitle"></div><div class="content peekbody" id="peekNextBody"></div></div>
      </div>
      <div class="scrubber" id="scrubber"><div class="scrubtrack" id="scrubTrack"><div class="track"></div></div></div>
      <div class="studyfoot" id="studyFoot"></div>
    </section>

    <section class="view" id="viewExam" hidden></section>

    <div class="loadbox" id="loading"><h2 id="loadTitle">불러오는 중</h2><p id="loadMsg">Notion에서 카드를 가져옴</p></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="retitlePop" id="retitlePop" hidden>이 문장을 제목으로</div>
</div>

<div class="sheetback" id="sheetback"></div>
<div class="sheet" id="settingsSheet">
  <div class="sheethandle"></div>
  <div class="sliderow"><label for="titleScale">제목</label><input type="range" id="titleScale" min="0.7" max="1.4" step="0.02" value="1"><span class="val" id="titleScaleVal"></span></div>
  <div class="sliderow"><label for="bodyScale">본문</label><input type="range" id="bodyScale" min="0.8" max="1.5" step="0.02" value="1"><span class="val" id="bodyScaleVal"></span></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
const escBr = (s) => String(s == null ? '' : s).split(/<br\s*\/?>/i).map(esc).join('<br>');
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

/* ── 원본 블록 렌더링(서버가 압축해 보낸 Notion 블록을 표시 시점에 그린다) ── */
function richHtml(rich){
  return (rich || []).map((t) => {
    let s = esc(t.t);
    if (t.code) s = '<code class="hl">' + s + '</code>';
    if (t.bold) s = '<b>' + s + '</b>';
    if (t.italic) s = '<i>' + s + '</i>';
    if (t.strike) s = '<s>' + s + '</s>';
    if (t.underline) s = '<u>' + s + '</u>';
    if (t.href) s = '<a href="' + esc(t.href) + '" target="_blank" rel="noopener">' + s + '</a>';
    return s;
  }).join('');
}
function tableHtml(b){
  const rows = b.rows || [];
  return '<table>' + rows.map((row, ri) => {
    const tag = b.headerRow && ri === 0 ? 'th' : 'td';
    return '<tr>' + row.map((cell) => '<' + tag + '>' + richHtml(cell) + '</' + tag + '>').join('') + '</tr>';
  }).join('') + '</table>';
}
// data-blk=detail 배열 인덱스 — 형광펜이 DOM 선택을 다시 그 블록의 rich 배열로 매핑할 때 씀.
// to_do(체크글자가 rich 앞에 붙어 오프셋이 어긋남)·code·divider·table은 형광펜 대상에서 뺀다.
function blockHtml(b, i){
  if (!b) return '';
  const blk = i == null ? '' : ' data-blk="' + i + '"';
  switch (b.type){
    case 'heading_1': return '<h3' + blk + '>' + richHtml(b.rich) + '</h3>';
    case 'heading_2': return '<h4' + blk + '>' + richHtml(b.rich) + '</h4>';
    case 'heading_3': return '<h5' + blk + '>' + richHtml(b.rich) + '</h5>';
    case 'bulleted_list_item': return '<li' + blk + '>' + richHtml(b.rich) + '</li>';
    case 'numbered_list_item': return '<li' + blk + '>' + richHtml(b.rich) + '</li>';
    case 'quote': return '<blockquote' + blk + '>' + richHtml(b.rich) + '</blockquote>';
    case 'callout': return '<div class="callout"' + blk + '>' + richHtml(b.rich) + '</div>';
    case 'to_do': return '<div>' + (b.checked ? '&#9745; ' : '&#9744; ') + richHtml(b.rich) + '</div>';
    case 'code': return '<pre><code>' + richHtml(b.rich) + '</code></pre>';
    case 'divider': return '<hr>';
    case 'table': return tableHtml(b);
    default: return b.rich ? '<p' + blk + '>' + richHtml(b.rich) + '</p>' : '';
  }
}
function blocksHtml(blocks){
  let html = '', open = null;
  (blocks || []).forEach((b, i) => {
    const isLi = b.type === 'bulleted_list_item' || b.type === 'numbered_list_item';
    const tag = b.type === 'numbered_list_item' ? 'ol' : 'ul';
    if (isLi){
      if (open !== tag){ if (open) html += '</' + open + '>'; html += '<' + tag + '>'; open = tag; }
    } else if (open){ html += '</' + open + '>'; open = null; }
    html += blockHtml(b, i);
  });
  if (open) html += '</' + open + '>';
  return html;
}
function hintHtml(c){
  if (c.hint == null) return null;
  if (typeof c.hint === 'string') return escBr(c.hint);
  return richHtml(c.hint.rich || []);
}
function detailHtml(c){
  if (!c.detail || !c.detail.length) return '';
  if (typeof c.detail[0] === 'string') return c.detail.map((t) => '<p>' + escBr(t) + '</p>').join('');

function showRetitlePop(rect, text){

document.addEventListener('selectionchange', () => {

/* ── 형광펜 모드 ── (youtube_dual_subtitle 확장과 동일 정책)
   버튼을 켜면 모드가 유지된다 — 이후 본문에서 드래그할 때마다(mouseup) 자동으로 그 구간의
   code(=형광펜) 여부를 뒤집는다. 이미 형광펜된 구간을 클릭(드래그 아님)해도 그 구간 전체가
   해제된다. 버튼을 다시 끄면 모드 해제(본문 선택은 평소처럼 아무 일도 안 함). */
let highlightMode = false;
function setHighlightMode(on){
  highlightMode = on;
  $('hlBtn').classList.toggle('active', on);
}
$('hlBtn').addEventListener('click', () => setHighlightMode(!highlightMode));

function currentCardForHighlight(){
  return currentView === 'study' ? studyCards[studyIdx] : (currentView === 'exam' ? examCards[examIdx] : null);
}
function plainOffsetInBlock(blockEl, node, offset){
  const walker = document.createTreeWalker(blockEl, NodeFilter.SHOW_TEXT);
  let pos = 0;
  while (walker.nextNode()){
    if (walker.currentNode === node) return pos + offset;
    pos += walker.currentNode.nodeValue.length;
  }
  return null;
}
function findBlockEl(node){
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el ? el.closest('[data-blk]') : null;
}
function getHighlightTarget(){
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const startBlk = findBlockEl(range.startContainer), endBlk = findBlockEl(range.endContainer);
  if (!startBlk || !endBlk || startBlk !== endBlk) return null;
  const start = plainOffsetInBlock(startBlk, range.startContainer, range.startOffset);
  const end = plainOffsetInBlock(startBlk, range.endContainer, range.endOffset);
  if (start == null || end == null || start >= end) return null;
  return { blk: startBlk.dataset.blk, start, end };
}
async function doHighlight(blk, start, end){
  const card = currentCardForHighlight();
  if (!card) return;
  const field = blk === 'hint' ? 'hint' : 'detail';
  const blockIndex = blk === 'hint' ? null : Number(blk);
  const res = await fetch('/api/highlight', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pageId: card.id, field, blockIndex, start, end }),
  }).then((r) => r.json()).catch(() => null);
  if (res && res.ok){
    Object.assign(card, res.card);
    if (currentView === 'study') renderStudyCard();
    else { const el = $('examBody'); if (el) el.innerHTML = cardBodyHtml(card); }
  } else toast('형광펜 실패');
}
function tryAutoHighlight(){
  if (!highlightMode) return;
  const t = getHighlightTarget();
  if (!t) return;
  window.getSelection().removeAllRanges();
  doHighlight(t.blk, t.start, t.end);
}
function onHighlightAreaClick(e){
  if (!highlightMode) return;
  const code = e.target.closest('code.hl');
  if (!code) return;
  // selectNodeContents(code)는 텍스트 오프셋이 아니라 자식 노드 인덱스로 범위를 잡아
  // plainOffsetInBlock의 텍스트노드 매칭과 안 맞는다 — 실제 첫/끝 텍스트노드로 범위를 잡는다.
  const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
  let first = null, last = null;
  while (walker.nextNode()){ if (!first) first = walker.currentNode; last = walker.currentNode; }
  if (!first) return;
  const range = document.createRange();
  range.setStart(first, 0);
  range.setEnd(last, last.nodeValue.length);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  tryAutoHighlight();
}
// 학습(#content)·시험 리빌 본문(#examBody, 동적으로 생성됨)에 위임 방식으로 붙인다.
document.addEventListener('mouseup', (e) => {
  if (!highlightMode) return;
  if (!e.target.closest('#content, #examBody')) return;
  setTimeout(tryAutoHighlight, 0);
});
document.addEventListener('click', (e) => {
  if (!highlightMode) return;
  if (!e.target.closest('#content, #examBody')) return;
  onHighlightAreaClick(e);
});

function enterStudy(subId, cards){

function renderStudyCard(){
  const c = studyCards[studyIdx];
  if (!c) return;

function renderStudyScrubber(){
  const n = studyCards.length;
  const scrubber = $('scrubber'), track = $('scrubTrack');
  if (n < 2){ scrubber.style.display = 'none'; return; }
  scrubber.style.display = 'block';
  let dots = track.querySelectorAll('.dot');
  while (dots.length < n){ const d = document.createElement('div'); d.className = 'dot'; track.appendChild(d); dots = track.querySelectorAll('.dot'); }
  while (dots.length > n){ dots[dots.length - 1].remove(); dots = track.querySelectorAll('.dot'); }
  dots.forEach((d, i) => { d.style.left = (n > 1 ? (i / (n - 1)) * 100 : 0) + '%'; d.classList.toggle('cur', i === studyIdx); });
}
function scrubIndexFromX(clientX){
  const rect = $('scrubTrack').getBoundingClientRect();
  const n = studyCards.length;
  if (n < 2) return 0;
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  return Math.round(ratio * (n - 1));
}
let scrubbing = false;
$('scrubber').addEventListener('pointerdown', (e) => {
  if (studyCards.length < 2) return;
  scrubbing = true;
  try { $('scrubber').setPointerCapture(e.pointerId); } catch (err) {}
  studyIdx = scrubIndexFromX(e.clientX); renderStudyCard();
});
$('scrubber').addEventListener('pointermove', (e) => {
  if (!scrubbing) return;
  const i = scrubIndexFromX(e.clientX);
  if (i !== studyIdx){ studyIdx = i; renderStudyCard(); }
});
$('scrubber').addEventListener('pointerup', () => { scrubbing = false; });
$('scrubber').addEventListener('pointercancel', () => { scrubbing = false; });

/* ── 좌우 스와이프=이전/다음(채점 없음, 소챕터 안에서 순환), 상하=스크롤(네이티브) ── */
const content = $('content'), scroller = $('scroller'), cardTitleEl = $('cardTitle');
const peekPrev = $('peekPrev'), peekNext = $('peekNext');
const COMMIT_RATIO = 0.5, FLICK_MS = 300, FLICK_RATIO = 0.18, TRANSITION_MS = 280, DRAG_SENS = 1.15;
let sx = 0, sy = 0, dx = 0, dy = 0, mode = null, dragging = false, dragW = 1, startT = 0;
function studyPrev(){ return studyCards[(studyIdx - 1 + studyCards.length) % studyCards.length]; }
function studyNext(){ return studyCards[(studyIdx + 1) % studyCards.length]; }
function setDragX(px){
  content.style.transform = 'translateX(' + px + 'px)'; cardTitleEl.style.transform = 'translateX(' + px + 'px)';
  peekPrev.style.transform = 'translateX(calc(-100% + ' + px + 'px))'; peekNext.style.transform = 'translateX(calc(100% + ' + px + 'px))';
}
function resetDragX(){ content.style.transform = ''; cardTitleEl.style.transform = ''; peekPrev.style.transform = ''; peekNext.style.transform = ''; }
function setDragTransition(t){ content.style.transition = t; cardTitleEl.style.transition = t; peekPrev.style.transition = t; peekNext.style.transition = t; }
function dragCurve(rawDx, w){
  const amp = rawDx * DRAG_SENS, sign = amp < 0 ? -1 : 1, abs = Math.abs(amp);
  return abs <= w ? amp : sign * (w + (abs - w) * 0.3);
}
scroller.addEventListener('pointerdown', (e) => {
  if (studyCards.length < 2) return;
  dragging = true; mode = null; sx = e.clientX; sy = e.clientY; dx = 0; dy = 0;
  dragW = scroller.offsetWidth || 1; startT = e.timeStamp;
  try { scroller.setPointerCapture(e.pointerId); } catch (err) {}
  setDragTransition('none');
  const pc = studyPrev(), nc = studyNext();
  $('peekPrevTitle').textContent = pc ? pc.front : ''; $('peekPrevBody').innerHTML = peekBodyHtml(pc);
  $('peekNextTitle').textContent = nc ? nc.front : ''; $('peekNextBody').innerHTML = peekBodyHtml(nc);
});
scroller.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dx = e.clientX - sx; dy = e.clientY - sy;
  if (mode === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (mode === 'h') setDragX(dragCurve(dx, dragW));
});
scroller.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false;
  if (mode === 'h'){
    const elapsed = e.timeStamp - startT, ratio = Math.abs(dx) / dragW;
    const isFlick = elapsed <= FLICK_MS && ratio >= FLICK_RATIO;
    const commit = isFlick || ratio >= COMMIT_RATIO;
    setDragTransition('transform ' + TRANSITION_MS + 'ms cubic-bezier(.2,.7,.3,1)');
    if (commit && dx < 0){
      setDragX(-dragW);
      content.addEventListener('transitionend', function onEnd(){ content.removeEventListener('transitionend', onEnd); setDragTransition('none'); resetDragX(); studyIdx = (studyIdx + 1) % studyCards.length; renderStudyCard(); }, { once: true });
    } else if (commit && dx > 0){
      setDragX(dragW);
      content.addEventListener('transitionend', function onEnd(){ content.removeEventListener('transitionend', onEnd); setDragTransition('none'); resetDragX(); studyIdx = (studyIdx - 1 + studyCards.length) % studyCards.length; renderStudyCard(); }, { once: true });
    } else resetDragX();
  }
  mode = null;
});
scroller.addEventListener('pointercancel', () => { dragging = false; mode = null; resetDragX(); });

/* ── 시험 ──
   제목만 → "정답 확인" 탭 → 본문 리빌 → "알고 있었음/몰랐음" 최종 확정(2단계 자기평가,
   되돌리기 없음). 순서는 매번 섞는다. 통과 기준(소챕터 5/10, 대챕터 80/100)은 게이트가
   아니라 순수 최고기록 현황판 — 통과 못해도 다음 챕터/소챕터는 그대로 열려 있다. */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let examSubId = null, examCards = [], examIdx = 0, examResults = {}, examLastSub = null, examLastChap = null;
async function enterExam(subId){
  showLoading('불러오는 중', '문제를 가져옴');

  if (data.error || !data.cards.length){ showLoading('불러오기 실패', data.error || '카드 없음', () => enterExam(subId)); return; }
  examSubId = subId; examCards = shuffle(data.cards); examIdx = 0; examResults = {};
  showView('exam', '시험', () => loadChapter(currentChapterId));
  setRetitleContext(() => examCards[examIdx]);
  renderExamView();
}
function renderExamView(){

    '</div>';

}
function renderExamCard(){
  if (examIdx >= examCards.length){ renderExamResult(); return; }
  $('examProg').textContent = (examIdx + 1) + ' / ' + examCards.length;
  const c = examCards[examIdx];
  $('examCard').innerHTML = '<div class="examtitle" id="examTitle">' + esc(c.front) + '</div>'
    + '<button class="examreveal" id="examReveal">정답 확인</button>';
  $('examJudge').hidden = true;
  $('examReveal').addEventListener('click', () => {
    $('examCard').innerHTML = '<div class="examtitle" id="examTitle">' + esc(c.front) + '</div>'
      + '<div class="content exambody" id="examBody">' + cardBodyHtml(c) + '</div>';
    $('examJudge').hidden = false;
  }, { once: true });
}
async function judgeCard(know){
  const c = examCards[examIdx];
  examResults[c.key] = know;
  // 결과 화면의 "최고기록"이 마지막 카드 응답을 놓친 채(경쟁 상태) 그리는 걸 막기 위해
  // 기다린다 — 카드당 한 번뿐인 탭이라 짧은 대기는 무마찰 원칙에 안 걸린다.
  const res = await apiAnswer(examSubId, c.key, know);
  if (res && res.ok){ examLastSub = res.sub; examLastChap = res.chap; }
  examIdx++;
  renderExamCard();
}
function renderExamResult(){
  const total = examCards.length;
  const score = examCards.filter((c) => examResults[c.key]).length;
  const wrong = examCards.filter((c) => !examResults[c.key]);
  const bestLine = examLastSub ? '이 소챕터 최고기록 ' + examLastSub.best + '/' + examLastSub.total : '';
  let actions = '<button class="primary" id="examExit">챕터로 돌아가기</button>';
  if (wrong.length){
    actions = '<button id="examRetryStudy">오답만 다시 복습(' + wrong.length + ')</button>'
      + '<button id="examRetryExam">오답만 바로 재시험</button>' + actions;
  }
  $('viewExam').innerHTML = '<div class="examresult"><div class="score">' + score + ' / ' + total + '</div>'
    + '<div class="best">' + esc(bestLine) + '</div>'
    + '<div class="actions">' + actions + '</div></div>';
  clearRetitleContext();
  const exit = $('examExit'); if (exit) exit.addEventListener('click', () => loadChapter(currentChapterId));
  const rs = $('examRetryStudy'); if (rs) rs.addEventListener('click', () => enterStudy(examSubId, wrong));
  const re = $('examRetryExam'); if (re) re.addEventListener('click', () => {
    examCards = shuffle(wrong); examIdx = 0; examResults = {};
    showView('exam', '시험', () => loadChapter(currentChapterId));
    setRetitleContext(() => examCards[examIdx]);
    renderExamView();
  });
}

/* 글자크기 슬라이더 */
function setSliderFill(el){ const pct = (el.value - el.min) / (el.max - el.min) * 100; el.style.setProperty('--fill', pct + '%'); }
function readPx(el){ return Math.round(parseFloat(getComputedStyle(el).fontSize)) + 'px'; }
const titleScale = $('titleScale'), bodyScale = $('bodyScale');
const savedTScale = lsGet('sd_tscale'), savedBScale = lsGet('sd_bscale');
if (savedTScale) titleScale.value = savedTScale;
if (savedBScale) bodyScale.value = savedBScale;
function applyTitleScale(){
  document.documentElement.style.setProperty('--tscale', titleScale.value);
  $('titleScaleVal').textContent = readPx($('cardTitle'));
  lsSet('sd_tscale', titleScale.value); setSliderFill(titleScale);
}
function applyBodyScale(){
  document.documentElement.style.setProperty('--bscale', bodyScale.value);
  $('bodyScaleVal').textContent = readPx(content);
  lsSet('sd_bscale', bodyScale.value); setSliderFill(bodyScale);
}
titleScale.addEventListener('input', applyTitleScale);
bodyScale.addEventListener('input', applyBodyScale);

/* ── 시작 ── */
applyTitleScale(); applyBodyScale();
loadChapters();
</script>
